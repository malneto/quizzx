const AMERICASUL = [
  {n:'Argentina', cap:'Buenos Aires', m:'Peso argentino', l:'Espanhol', pop:'~46 mi', cur:'Foi um dos países mais ricos do mundo no início do século XX. Terra do tango e de Messi.', mapQ:'Argentina', z:4},
  {n:'Bolívia', cap:'Sucre', m:'Boliviano', l:'Espanhol, Quíchua e Aimará', pop:'~12 mi', cur:'Tem duas capitais: Sucre (constitucional) e La Paz (sede do governo, a mais alta do mundo).', mapQ:'Bolivia', z:4},
  {n:'Brasil', cap:'Brasília', m:'Real', l:'Português', pop:'~203 mi', cur:'Maior país da América do Sul em área e população. Único de língua portuguesa no continente.', mapQ:'Brazil', z:3},
  {n:'Chile', cap:'Santiago', m:'Peso chileno', l:'Espanhol', pop:'~19 mi', cur:'País mais estreito e comprido do mundo. Junto com o Equador, é um dos dois que NÃO fazem fronteira com o Brasil.', mapQ:'Chile', z:3},
  {n:'Colômbia', cap:'Bogotá', m:'Peso colombiano', l:'Espanhol', pop:'~52 mi', cur:'Único país sul-americano banhado pelos oceanos Pacífico e Atlântico (Caribe).', mapQ:'Colombia', z:4},
  {n:'Equador', cap:'Quito', m:'Dólar americano', l:'Espanhol', pop:'~18 mi', cur:'Recebe o nome da Linha do Equador, que o corta. Abriga as Ilhas Galápagos.', mapQ:'Ecuador', z:4},
  {n:'Guiana', cap:'Georgetown', m:'Dólar guianense', l:'Inglês', pop:'~0,8 mi', cur:'Único país do continente de língua inglesa. Vive um boom de petróleo recente.', mapQ:'Guyana', z:5},
  {n:'Paraguai', cap:'Assunção', m:'Guarani', l:'Espanhol e Guarani', pop:'~6,9 mi', cur:'País bilíngue: o guarani é língua oficial ao lado do espanhol. Não tem saída para o mar.', mapQ:'Paraguay', z:5},
  {n:'Peru', cap:'Lima', m:'Sol', l:'Espanhol e Quíchua', pop:'~34 mi', cur:'Coração do antigo Império Inca. Abriga Machu Picchu, uma das maravilhas do mundo.', mapQ:'Peru', z:4},
  {n:'Suriname', cap:'Paramaribo', m:'Dólar surinamês', l:'Holandês', pop:'~0,6 mi', cur:'Menor país da América do Sul em área e população. Idioma oficial: holandês.', mapQ:'Suriname', z:5},
  {n:'Uruguai', cap:'Montevidéu', m:'Peso uruguaio', l:'Espanhol', pop:'~3,4 mi', cur:'Um dos países mais estáveis e progressistas da região. Bicampeão mundial de futebol.', mapQ:'Uruguay', z:5},
  {n:'Venezuela', cap:'Caracas', m:'Bolívar', l:'Espanhol', pop:'~28 mi', cur:'Tem as maiores reservas de petróleo do mundo e o Salto Angel, a cachoeira mais alta do planeta.', mapQ:'Venezuela', z:4}
];

const SUBJECT_LABELS = {
  oceanos:'OCEANOS', continentes:'CONTINENTES', fronteiras:'FRONTEIRAS DO BRASIL',
  americasul:'AMÉRICA DO SUL', ufs:'ESTADOS (UF)', capitais:'CAPITAIS'
};

// ======================= MOTOR =======================
let TOTAL_Q = 10, subjectKey = 'tudo', userEmail = '', currentQ = 0, score = 0;
let round = [], selected = null, ready = false;

function shuffle(arr){ const a=[...arr]; for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function pickStrings(pool, n, exclude){ return shuffle(pool.filter(x=>x!==exclude)).slice(0,n); }

function poolFor(key){
  if(key==='oceanos')     return OCEANOS.map(x=>({...x,_s:'oceanos'}));
  if(key==='continentes') return CONTINENTES.map(x=>({...x,_s:'continentes'}));
  if(key==='fronteiras')  return FRONTEIRAS.map(x=>({...x,_s:'fronteiras'}));
  if(key==='americasul')  return AMERICASUL.map(x=>({...x,_s:'americasul'}));
  if(key==='ufs')         return UF.map(x=>({...x,_s:'ufs'}));
  if(key==='capitais')    return UF.map(x=>({...x,_s:'capitais'}));
  return [];
}
function fullPool(){
  if(subjectKey==='tudo') return ['oceanos','continentes','fronteiras','americasul','ufs','capitais'].flatMap(poolFor);
  return poolFor(subjectKey);
}

function selectSubject(btn,key){
  subjectKey = key;
  document.querySelectorAll('button[onclick^="selectSubject"]').forEach(b=>b.classList.remove('selected'));
  btn.classList.add('selected');
  const total = fullPool().length;
  document.getElementById('poolNote').textContent = `${total} perguntas disponíveis neste assunto.`;
}
function selectQty(btn,n){
  TOTAL_Q = n;
  document.querySelectorAll('button[onclick^="selectQty"]').forEach(b=>b.classList.remove('selected'));
  btn.classList.add('selected');
}

function start(){
  userEmail = (document.getElementById('emailInput').value || '').trim();
  currentQ = 0; score = 0;
  const pool = fullPool();
  round = shuffle(pool).slice(0, Math.min(TOTAL_Q, pool.length));
  document.getElementById('headerArea').classList.add('hidden');
  document.getElementById('startScreen').classList.add('hidden');
  document.getElementById('finalScreen').classList.add('hidden');
  document.getElementById('quizScreen').classList.remove('hidden');
  showQuestion();
}

// Constrói a pergunta: {qtext, correct, options[]}
function buildQuestion(item){
  const s = item._s;
  if(s==='oceanos'){
    const opts = shuffle([item.n, ...pickStrings(OCEANOS.map(o=>o.n),3,item.n)]);
    return {qtext:`${item.clue}<br><span style="color:#6bb5ff;font-size:0.85em">Que oceano é este?</span>`, correct:item.n, options:opts};
  }
  if(s==='continentes'){
    const opts = shuffle([item.n, ...pickStrings(CONTINENTES.map(o=>o.n),3,item.n)]);
    return {qtext:`${item.clue}<br><span style="color:#6bb5ff;font-size:0.85em">Que continente é este?</span>`, correct:item.n, options:opts};
  }
  if(s==='fronteiras'){
    const opts = shuffle([item.n, ...pickStrings(NAO_FRONTEIRA,3,item.n)]);
    return {qtext:`Qual destes <strong>faz fronteira</strong> com o Brasil?`, correct:item.n, options:opts};
  }
  if(s==='americasul'){
    const opts = shuffle([item.cap, ...pickStrings(AMERICASUL.map(o=>o.cap),3,item.cap)]);
    return {qtext:`Qual é a capital de <strong>${item.n}</strong>?`, correct:item.cap, options:opts};
  }
  if(s==='ufs'){
    const opts = shuffle([item.reg, ...pickStrings(REGIOES,3,item.reg)]);
    return {qtext:`Em qual <strong>região</strong> fica <strong>${item.n}</strong> (${item.sigla})?`, correct:item.reg, options:opts};
  }
  if(s==='capitais'){
    const opts = shuffle([item.cap, ...pickStrings(UF.map(o=>o.cap),3,item.cap)]);
    return {qtext:`Qual é a capital de <strong>${item.n}</strong>?`, correct:item.cap, options:opts};
  }
}

function mapEmbed(q,z){
  return `<div class="feedback-map"><iframe loading="lazy" src="https://maps.google.com/maps?q=${encodeURIComponent(q)}&z=${z||4}&output=embed"></iframe></div>`;
}
function row(label,val){ return `<div class="info-row"><span class="info-label">${label}</span><span class="info-value">${val}</span></div>`; }

// Feedback enriquecido por assunto
function buildFeedback(item){
  const s = item._s; let title='', rows='', mq='', z=4;
  if(s==='oceanos'){
    title = `<strong>${item.n}</strong>`;
    rows = row('Área',item.area)+row('Profundidade média',item.profMed)+row('Ponto mais profundo',item.profMax)+row('Banha',item.banha);
    mq=item.mapQ; z=item.z;
  } else if(s==='continentes'){
    title = `<strong>${item.n}</strong>`;
    rows = row('Área',item.area)+row('População',item.pop)+row('Países',item.paises)+row('Maior país',item.maior);
    mq=item.mapQ; z=item.z;
  } else if(s==='fronteiras'){
    title = `<strong>${item.n}</strong> <span>— faz fronteira com o Brasil</span>`;
    rows = row('Capital',item.cap)+row('Extensão da fronteira',item.ext)+row('Divisa pela região',item.regBR)+row('Continente','América do Sul');
    mq=item.mapQ; z=item.z;
  } else if(s==='americasul'){
    title = `<strong>${item.n}</strong> <span>— América do Sul</span>`;
    rows = row('Capital',item.cap)+row('Moeda',item.m)+row('Idioma',item.l)+row('População',item.pop);
    mq=item.mapQ; z=item.z;
  } else { // ufs / capitais
    title = `<strong>${item.n}</strong> <span>— ${item.reg}</span>`;
    rows = row('Sigla',item.sigla)+row('Capital',item.cap)+row('Região',item.reg);
    mq=`${item.n}, Brasil`; z=5;
  }
  return `
    <div class="feedback-title">${title}</div>
    <div class="country-info">
      ${rows}
      <div class="info-history">${item.cur}</div>
    </div>
    ${mapEmbed(mq,z)}`;
}

function showQuestion(){
  const item = round[currentQ];
  const q = buildQuestion(item);
  item.__q = q;
  document.getElementById('scoreDisplay').textContent = `Acertos: ${score} / ${currentQ}`;
  document.getElementById('progressFill').style.width = (currentQ / round.length * 100) + '%';
  const html = `
    <div class="question-card">
      <div class="subject-tag">${SUBJECT_LABELS[item._s]}</div>
      <div class="question-number">Pergunta ${currentQ+1} de ${round.length}</div>
      <div class="question-text">${q.qtext}</div>
      <div class="options">
        ${q.options.map(o=>`<button class="option-btn" data-value="${o}" onclick="selectOption(this)">${o}</button>`).join('')}
      </div>
      <button class="submit-btn" id="submitBtn" onclick="checkAnswer()" disabled>RESPONDER</button>
      <div id="feedbackArea"></div>
    </div>`;
  document.getElementById('questionArea').innerHTML = html;
  selected = null; ready = true;
  window.scrollTo(0,0);
}

function selectOption(btn){
  if(!ready) return;
  document.querySelectorAll('.option-btn').forEach(b=>b.classList.remove('selected'));
  btn.classList.add('selected');
  selected = btn.dataset.value;
  document.getElementById('submitBtn').disabled = false;
}

function checkAnswer(){
  if(selected===null) return;
  ready = false;
  const item = round[currentQ];
  const correct = item.__q.correct;
  const isCorrect = selected === correct;

  document.querySelectorAll('.option-btn').forEach(btn=>{
    btn.style.pointerEvents='none';
    if(btn.dataset.value===correct) btn.classList.add('correct');
    else if(btn.dataset.value===selected && !isCorrect) btn.classList.add('wrong');
  });

  if(isCorrect) score++;
  document.getElementById('scoreDisplay').textContent = `Acertos: ${score} / ${currentQ+1}`;
  document.getElementById('submitBtn').classList.add('hidden');

  const last = currentQ >= round.length-1;
  const nextLabel = last ? 'VER RESULTADO &#127942;' : 'PRÓXIMA &#10132;';
  document.getElementById('feedbackArea').innerHTML = `
    <button class="next-btn" onclick="nextQuestion()">${nextLabel}</button>
    <div class="feedback ${isCorrect?'correct':'wrong'}">
      <div class="feedback-icon">${isCorrect?'&#10024; ACERTOU! &#10024;':'&#10060; Errou!'}</div>
      ${buildFeedback(item)}
    </div>
    <button class="next-btn" onclick="nextQuestion()">${nextLabel}</button>`;
  selected = null;
  window.scrollTo(0,0);
}

function nextQuestion(){
  currentQ++;
  window.scrollTo(0,0);
  if(currentQ < round.length) showQuestion();
  else showFinal();
}

function summaryOf(item){
  const s = item._s;
  if(s==='oceanos'||s==='continentes') return item.n;
  if(s==='fronteiras') return `${item.n} faz fronteira com o Brasil (${item.regBR})`;
  if(s==='americasul') return `${item.n} → ${item.cap}`;
  if(s==='ufs') return `${item.n} (${item.sigla}) → Região ${item.reg}`;
  if(s==='capitais') return `${item.n} → ${item.cap}`;
  return item.n;
}

function showFinal(){
  document.getElementById('quizScreen').classList.add('hidden');
  const final = document.getElementById('finalScreen');
  final.classList.remove('hidden');
  const pct = Math.round(score / round.length * 100);
  let cls, emoji, msg;
  if(pct>=80){ cls='great'; emoji='&#127775;'; msg='Você é um MESTRE da geografia!'; }
  else if(pct>=50){ cls='good'; emoji='&#128170;'; msg='Muito bom! Continue treinando e logo domina tudo!'; }
  else { cls='try-again'; emoji='&#128640;'; msg='O mundo é enorme! Continue jogando para aprender mais!'; }
  const subjName = subjectKey==='tudo' ? 'Tudo' : SUBJECT_LABELS[subjectKey];

  final.innerHTML = `
    <div class="final-screen">
      <h1>RESULTADO</h1>
      <div style="font-size:3em">${emoji}</div>
      <div class="final-score ${cls}">${score}/${round.length}</div>
      <div class="final-msg">${msg}</div>
      <div style="color:#8888cc;margin-bottom:20px">Assunto: ${subjName} | Acurácia: ${pct}%</div>
      ${userEmail?`<div id="emailStatus" style="color:#6bff6b;margin-bottom:15px;font-size:0.85em">Preparando e-mail para ${userEmail}...</div>`:''}
      <button class="restart-btn" onclick="start()">JOGAR DE NOVO</button>
      <button class="restart-btn" onclick="backToStart()">TROCAR ASSUNTO</button>
    </div>`;
  if(userEmail) sendResult(pct, subjName);
}

function sendResult(pct, subjName){
  const subject = encodeURIComponent(`QuizX - Geografia: ${score}/${round.length} (${pct}%)`);
  const lines = [`QuizX - Geografia (Brasil e Mundo)`, ``, `Assunto: ${subjName}`, `Resultado: ${score}/${round.length} (${pct}%)`, ``, `Perguntas da rodada:`];
  round.forEach((it,i)=>lines.push(`${i+1}. ${summaryOf(it)}`));
  lines.push(``, `---`, `Enviado por QuizX`);
  const body = encodeURIComponent(lines.join('\n'));
  window.open(`mailto:${userEmail}?subject=${subject}&body=${body}`, '_blank');
  const st = document.getElementById('emailStatus');
  if(st) st.textContent = `E-mail preparado para ${userEmail}!`;
}

function backToStart(){
  document.getElementById('headerArea').classList.remove('hidden');
  document.getElementById('finalScreen').classList.add('hidden');
  document.getElementById('quizScreen').classList.add('hidden');
  document.getElementById('startScreen').classList.remove('hidden');
}

// inicializa nota de contagem
selectSubject(document.querySelector('button[onclick^="selectSubject"]'), 'tudo');
</script>
</body>
</html>
