":"time","t":"games","q":"The clock shows 7:15. We say it is ___.","opts":["quarter past seven","half past seven","seven o'clock","quarter past eight"],"a":"quarter past seven","tr":"7:15 = 'quarter past seven' (sete e quinze).","tip":"X:15 = <b>quarter past</b> X."},{"s":"cal","t":"games","q":"You pick your power-ups ___ the match starts, when you are still in the menu.<br>(antes)","opts":["before","after","during","late"],"a":"before","tr":"'Before' = antes.","tip":"<b>before</b> = antes."},{"s":"inst","t":"games","q":"At the end of the level, the band plays a live ___ for the players.<br>(apresentação ao vivo)","opts":["concert","boss","level","score"],"a":"concert","tr":"'Concert' = concerto/show ao vivo.","tip":"<b>concert</b> = show/concerto."},{"s":"pastc","t":"games","q":"We were fighting the boss ___ the internet stopped.<br>(ação longa interrompida)","opts":["when","while","during","after"],"a":"when","tr":"Usamos 'when' quando uma ação curta (past simple) interrompe uma longa.","tip":"interrupção → <b>when</b> + past simple."},{"s":"sugg","t":"games","q":"Pick the best suggestion to start a match.","opts":["Let's start the match!","I start the match yesterday.","She started the match.","Do you start the match?"],"a":"Let's start the match!","tr":"'Let's start the match!' é uma sugestão para fazer algo juntos.","tip":"<b>Let's</b> + verbo = sugestão."},{"s":"time","t":"games","q":"I beat the boss two minutes ___.<br>(no passado, atrás)","opts":["ago","early","late","soon"],"a":"ago","tr":"'Ago' = atrás (tempo no passado).","tip":"<b>ago</b> = atrás (passado)."},{"s":"cal","t":"games","q":"The snow level fits which season?<br>(a estação fria com neve)","opts":["winter","summer","spring","fall"],"a":"winter","tr":"'Winter' = inverno, a estação fria.","tip":"<b>winter</b> = inverno (frio/neve)."},{"s":"inst","t":"games","q":"In the game's final level, a hero plays the <b>violin</b> to open a magic door. How does she play it?<br>(Como ela toca o violino?)","opts":["with a bow","by blowing","by hitting it","with keys"],"a":"with a bow","tr":"O violino se toca com um arco (bow). Bater = drum, soprar = trumpet, teclas = piano.","tip":"violin = arco (bow); piano = teclas (keys); drum = bater (hit); trumpet = soprar (blow)."},{"s":"pastc","t":"games","q":"Choose the correct negative sentence about the game.","opts":["They weren't winning the match.","They wasn't winning the match.","They weren't won the match.","They not were winning the match."],"a":"They weren't winning the match.","tr":"Com 'they' a negativa é 'weren't' + verbo-ing.","tip":"they → <b>weren't</b> + verbo-ing."},{"s":"sugg","t":"games","q":"Your friend suggests a new game. A polite reply is ___.","opts":["Sure!","No, I am six.","It is a controller.","The score is high."],"a":"Sure!","tr":"'Sure!' é uma resposta educada para aceitar uma sugestão.","tip":"aceitar → <b>Sure!</b>"},{"s":"time","t":"games","q":"The player arrived ___ and started the match before everyone else.<br>(adiantado/cedo)","opts":["early","late","ago","soon"],"a":"early","tr":"'Early' = cedo/adiantado.","tip":"<b>early</b> = cedo."},{"s":"cal","t":"games","q":"The hot beach level fits which season?<br>(a estação quente)","opts":["summer","winter","fall","spring"],"a":"summer","tr":"'Summer' = verão, a estação quente.","tip":"<b>summer</b> = verão (quente)."},{"s":"inst","t":"games","q":"The boss music has a strong, fast ___ that makes you tap the buttons in time.<br>(Que palavra significa o batimento/ritmo da musica?)","opts":["rhythm","band","concert","tune"],"a":"rhythm","tr":"Rhythm = ritmo, o batimento da musica. Band = banda, concert = show, tune = melodia.","tip":"rhythm = ritmo; tune = melodia; band = banda; concert = concerto/show."},{"s":"pastc","t":"games","q":"Yesterday at 8 p.m., Lucas ___ a racing game with his cousin.<br>(Complete no Past Continuous.)","opts":["was playing","were playing","is playing","play"],"a":"was playing","tr":"Lucas (he) usa 'was' + verbo-ing: was playing (estava jogando).","tip":"I/he/she/it = was; you/we/they = were. Past Continuous = was/were + verbo-ing."},{"s":"sugg","t":"games","q":"Maya is bored with this level. She says: '___ play a new game instead?'<br>(Complete a sugestao.)","opts":["Why don't we","We are","We don't","Do we"],"a":"Why don't we","tr":"'Why don't we...?' e uma forma de dar sugestao (Por que nao...?).","tip":"Sugestoes: Let's + verbo / Why don't we...? / Who wants to...?"},{"s":"inst","t":"animais","q":"At the safari concert, you hit it with sticks. Which instrument is it?","opts":["drum","violin","piano","trumpet"],"a":"drum","tr":"Tocamos o tambor (drum) batendo com baquetas (sticks) ou com as mãos.","tip":"<b>drum</b> = bater com baquetas/mãos."},{"s":"emo","t":"animais","q":"What is the opposite of <b>loud</b>?<br>The lion is loud, but the rabbit is very ___.","opts":["soft","fast","happy","high"],"a":"soft","tr":"O antonimo de loud (alto) e soft (baixo/suave).","tip":"loud &harr; <b>soft</b>."},{"s":"pastc","t":"animais","q":"The lion ___ sleeping under the tree.","opts":["was","were","is","are"],"a":"was","tr":"He/she/it usam <b>was</b> no past continuous (was + verbo-ing).","tip":"it &rarr; <b>was</b> + verbo-ING."},{"s":"sugg","t":"animais","q":"Which sentence is a suggestion?","opts":["Let's see the lions!","The lion is big.","Where is the lion?","The lion sleeps."],"a":"Let's see the lions!","tr":"Let's + verbo e uma forma de fazer uma sugestao (vamos...).","tip":"<b>Let's</b> + verbo = sugestao."},{"s":"time","t":"animais","q":"The lions eat at 12:00 in the day. This time is called ___.","opts":["midday","midnight","minute","hour"],"a":"midday","tr":"Midday = meio-dia (12:00).","tip":"<b>midday</b> = meio-dia 12:00."},{"s":"cal","t":"animais","q":"The zookeeper feeds the lions every day. He feeds them ___.","opts":["daily","weekly","monthly","yearly"],"a":"daily","tr":"day &rarr; daily (diariamente, todo dia).","tip":"day + ly = <b>daily</b>."},{"s":"inst","t":"animais","q":"The elephant blows it. It is made of metal. Which instrument is it?","opts":["trumpet","guitar","drum","violin"],"a":"trumpet","tr":"O trompete (trumpet) é de metal e tocamos soprando (blow).","tip":"<b>trumpet</b> = soprar, metal."},{"s":"emo","t":"animais","q":"What is the opposite of <b>happy</b>?<br>The monkey is happy, but the lost bird is ___.","opts":["sad","loud","fast","low"],"a":"sad","tr":"O antonimo de happy (feliz) e sad (triste).","tip":"happy &harr; <b>sad</b>."},{"s":"pastc","t":"animais","q":"The monkeys ___ jumping in the trees all morning.","opts":["were","was","is","am"],"a":"were","tr":"Para they (eles) usamos <b>were</b> no past continuous.","tip":"they &rarr; <b>were</b> + verbo-ING."},{"s":"sugg","t":"animais","q":"Complete the suggestion:<br>___ go to the safari park today!","opts":["Let's","Is","Was","Did"],"a":"Let's","tr":"Let's = Let us, usado para sugerir fazer algo juntos.","tip":"<b>Let's</b> + verbo."},{"s":"time","t":"animais","q":"The owls hunt at 12:00 at night. This time is called ___.","opts":["midnight","midday","early","hour"],"a":"midnight","tr":"Midnight = meia-noite (12:00 da noite).","tip":"<b>midnight</b> = meia-noite."},{"s":"cal","t":"animais","q":"We clean the elephant house every week. We clean it ___.","opts":["weekly","daily","yearly","monthly"],"a":"weekly","tr":"week &rarr; weekly (semanalmente, toda semana).","tip":"week + ly = <b>weekly</b>."},{"s":"inst","t":"animais","q":"The monkey plays this with a bow and strings. Which instrument is it?","opts":["violin","piano","drum","trumpet"],"a":"violin","tr":"O violino (violin) tem cordas (strings) e tocamos com um arco (bow).","tip":"<b>violin</b> = arco/cordas."},{"s":"emo","t":"animais","q":"What is the opposite of <b>fast</b>?<br>The cheetah is fast, but the turtle is ___.","opts":["slow","soft","sad","high"],"a":"slow","tr":"O antonimo de fast (rapido) e slow (lento).","tip":"fast &harr; <b>slow</b>."},{"s":"pastc","t":"animais","q":"I ___ watching the giraffes at the zoo.","opts":["was","were","are","is"],"a":"was","tr":"Para I (eu) usamos <b>was</b> no past continuous.","tip":"I &rarr; <b>was</b> + verbo-ING."},{"s":"sugg","t":"animais","q":"Complete the suggestion:<br>Why don't we ___ the elephants?","opts":["feed","feeding","fed","feeds"],"a":"feed","tr":"Depois de 'Why don't we' usamos o verbo na forma base (feed).","tip":"Why don't we + <b>verbo base</b>?"},{"s":"time","t":"animais","q":"Read the clock: the safari starts at 3:30. We say ___.","opts":["half past three","quarter past three","three o'clock","half past four"],"a":"half past three","tr":"3:30 = half past three (meia hora depois das tres).","tip":"X:30 = <b>half past</b> X."},{"s":"cal","t":"animais","q":"The vet visits the giraffes every month. She visits ___.","opts":["monthly","daily","weekly","yearly"],"a":"monthly","tr":"month &rarr; monthly (mensalmente, todo mes).","tip":"month + ly = <b>monthly</b>."},{"s":"inst","t":"animais","q":"The giraffe presses the keys. Which instrument is it?","opts":["piano","trumpet","violin","drum"],"a":"piano","tr":"O piano tem teclas (keys) que apertamos para tocar.","tip":"<b>piano</b> = teclas."},{"s":"emo","t":"animais","q":"What is the opposite of <b>high</b>?<br>The bird sings high, but the elephant sounds ___.","opts":["low","happy","fast","soft"],"a":"low","tr":"O antonimo de high (agudo/alto) e low (grave/baixo).","tip":"high &harr; <b>low</b>."},{"s":"pastc","t":"animais","q":"We ___ feeding the elephants at three o'clock.","opts":["were","was","is","am"],"a":"were","tr":"Para we (nos) usamos <b>were</b> no past continuous.","tip":"we &rarr; <b>were</b> + verbo-ING."},{"s":"sugg","t":"animais","q":"Complete the suggestion:<br>Who wants to ___ the monkeys with me?","opts":["watch","watching","watched","watches"],"a":"watch","tr":"Depois de 'Who wants to' usamos o verbo na forma base (watch).","tip":"Who wants to + <b>verbo base</b>?"},{"s":"time","t":"animais","q":"Read the clock: the monkeys play at 5:15. We say ___.","opts":["quarter past five","half past five","five o'clock","quarter past four"],"a":"quarter past five","tr":"5:15 = quarter past five (um quarto de hora depois das cinco).","tip":"X:15 = <b>quarter past</b> X."},{"s":"cal","t":"animais","q":"The big animal party happens every year. It happens ___.","opts":["yearly","daily","weekly","monthly"],"a":"yearly","tr":"year &rarr; yearly (anualmente, todo ano).","tip":"year + ly = <b>yearly</b>."},{"s":"inst","t":"animais","q":"The parrot plays this. It has six strings, but no bow. Which instrument is it?","opts":["guitar","piano","trumpet","drum"],"a":"guitar","tr":"O violao/guitarra (guitar) tem cordas (strings) e tocamos com os dedos.","tip":"<b>guitar</b> = cordas."},{"s":"emo","t":"animais","q":"What is the opposite of <b>relaxed</b>?<br>The sleepy lion is relaxed, but the running monkey is ___.","opts":["excited","soft","slow","low"],"a":"excited","tr":"O antonimo de relaxed (relaxado) e excited (agitado/animado).","tip":"relaxed &harr; <b>excited</b>."},{"s":"pastc","t":"animais","q":"Choose the correct past continuous:<br>The parrot ___ a song.","opts":["was singing","were singing","is singing","was sing"],"a":"was singing","tr":"Past continuous = was/were + verbo-ING. Para it usamos was singing.","tip":"was/were + verbo-<b>ING</b>."},{"s":"sugg","t":"animais","q":"Your friend says 'Let's see the dolphins!' A good answer is:","opts":["Good idea!","The dolphin is blue.","It is two o'clock.","I am a lion."],"a":"Good idea!","tr":"Para aceitar uma sugestao dizemos 'Good idea!' ou 'Sure!'.","tip":"Aceitar sugestao: <b>Good idea!</b> / Sure!"},{"s":"time","t":"animais","q":"Read the clock: the zoo opens at 8:00. We say ___.","opts":["eight o'clock","half past eight","quarter past eight","midday"],"a":"eight o'clock","tr":"8:00 = eight o'clock (oito em ponto).","tip":"X:00 = X <b>o'clock</b>."},{"s":"cal","t":"animais","q":"Order in time: We wash, eat, and then sleep. We eat ___ we wash.","opts":["after","before","during","daily"],"a":"after","tr":"After = depois. Comemos depois de lavar.","tip":"<b>after</b> = depois."},{"s":"inst","t":"animais","q":"The lion is on the ___ to play music for all the animals.","opts":["stage","tune","rhythm","band"],"a":"stage","tr":"O palco (stage) e o lugar onde os musicos se apresentam.","tip":"<b>stage</b> = palco."},{"s":"emo","t":"animais","q":"A scary scene in the lion movie has ___ music.","opts":["scary","happy","calm","soft"],"a":"scary","tr":"Uma cena assustadora (scary scene) tem musica assustadora (scary).","tip":"scene assustadora &rarr; musica <b>scary</b>."},{"s":"pastc","t":"animais","q":"Negative: The dolphin ___ swimming in the cold water.","opts":["wasn't","weren't","isn't","don't"],"a":"wasn't","tr":"Negativa no singular (it): wasn't = was not.","tip":"it negativo &rarr; <b>wasn't</b>."},{"s":"sugg","t":"animais","q":"Which is the best way to suggest going to the zoo?","opts":["Let's go to the zoo!","The zoo is far.","Did you go to the zoo?","The zoo has lions."],"a":"Let's go to the zoo!","tr":"Let's go = vamos, uma sugestao para fazer algo juntos.","tip":"Sugestao &rarr; <b>Let's</b> + verbo."},{"s":"time","t":"animais","q":"Make a compound noun: sun + dial = ___.","opts":["sundial","sunclock","dialsun","sunhour"],"a":"sundial","tr":"sun + dial = sundial (relogio de sol).","tip":"sun + dial = <b>sundial</b>."},{"s":"cal","t":"animais","q":"The monkey eats ___ it sleeps. (It eats first, then sleeps.)","opts":["before","after","during","weekly"],"a":"before","tr":"Before = antes. O macaco come antes de dormir.","tip":"<b>before</b> = antes."},{"s":"inst","t":"animais","q":"The animals come to the jungle ___ to listen to the music.","opts":["concert","rhythm","tune","instrument"],"a":"concert","tr":"Concert = concerto/apresentacao musical para a plateia.","tip":"<b>concert</b> = concerto."},{"s":"emo","t":"animais","q":"A calm scene by the quiet ocean has ___ music.","opts":["calm","loud","scary","fast"],"a":"calm","tr":"Uma cena calma (calm scene) tem musica calma (calm).","tip":"scene calma &rarr; musica <b>calm</b>."},{"s":"pastc","t":"animais","q":"Negative: The lions ___ running in the savanna.","opts":["weren't","wasn't","aren't","doesn't"],"a":"weren't","tr":"Negativa no plural (they): weren't = were not.","tip":"they negativo &rarr; <b>weren't</b>."},{"s":"sugg","t":"animais","q":"Which sentence is a suggestion, not a question?","opts":["Why don't we visit the giraffes?","Is the giraffe tall?","Where are the giraffes?","Are giraffes fast?"],"a":"Why don't we visit the giraffes?","tr":"'Why don't we...?' parece pergunta mas e uma sugestao (vamos...?).","tip":"<b>Why don't we</b> + verbo = sugestao."},{"s":"time","t":"animais","q":"Make a compound noun: hour + glass = ___.","opts":["hourglass","glasshour","hourclock","sandhour"],"a":"hourglass","tr":"hour + glass = hourglass (ampulheta).","tip":"hour + glass = <b>hourglass</b>."},{"s":"cal","t":"animais","q":"The lion sleeps ___ the day and hunts at night.","opts":["during","before","after","yearly"],"a":"during","tr":"During = durante. O leao dorme durante o dia.","tip":"<b>during</b> = durante."},{"s":"inst","t":"animais","q":"The monkey band will ___ on stage for the zoo animals tonight.","opts":["perform","rhythm","tune","jazz"],"a":"perform","tr":"Perform = tocar/apresentar para a plateia.","tip":"<b>perform</b> = apresentar-se para a plateia."},{"s":"emo","t":"animais","q":"The music in the safari film makes me feel sad. We talk about my ___.","opts":["emotion","stage","minute","season"],"a":"emotion","tr":"Emotion = emocao, o que sentimos (feliz, triste...).","tip":"<b>emotion</b> = emocao."},{"s":"pastc","t":"animais","q":"Question: ___ the monkey eating a banana?","opts":["Was","Were","Did","Is"],"a":"Was","tr":"Pergunta no past continuous: Was + sujeito (he/she/it) + verbo-ing?","tip":"Pergunta com it &rarr; <b>Was</b> + verbo-ING?"},{"s":"sugg","t":"animais","q":"Complete the suggestion:<br>Let's ___ photos of the parrots!","opts":["take","taking","took","takes"],"a":"take","tr":"Depois de 'Let's' usamos o verbo na forma base (take).","tip":"Let's + <b>verbo base</b>."},{"s":"time","t":"animais","q":"Make a compound noun: cell + phone = ___.","opts":["cellphone","phonecell","cellclock","telephone"],"a":"cellphone","tr":"cell + phone = cellphone (celular).","tip":"cell + phone = <b>cellphone</b>."},{"s":"cal","t":"animais","q":"It is hot in the savanna and the flowers grow. Which season is it?","opts":["summer","winter","spring","fall"],"a":"summer","tr":"Summer = verao, a estacao mais quente.","tip":"<b>summer</b> = verao (quente)."},{"s":"inst","t":"animais","q":"The dolphin likes to ___ a happy song with its voice.","opts":["sing","drum","blow","press"],"a":"sing","tr":"Sing = cantar; usamos a voz, nao um instrumento.","tip":"Para a voz usamos <b>sing</b>."},{"s":"emo","t":"animais","q":"The music we hear during a film is called the ___.","opts":["soundtrack","shadow","calendar","band"],"a":"soundtrack","tr":"Soundtrack = trilha sonora, a musica do filme.","tip":"<b>soundtrack</b> = trilha sonora."},{"s":"pastc","t":"animais","q":"Question: ___ you watching the whales in the ocean?","opts":["Were","Was","Did","Are"],"a":"Were","tr":"Pergunta no past continuous: Were + you/we/they + verbo-ing?","tip":"Pergunta com you &rarr; <b>Were</b> + verbo-ING?"},{"s":"sugg","t":"animais","q":"Your friend suggests 'Why don't we feed the monkeys?' A good answer is:","opts":["Sure!","The monkey is brown.","It is midnight.","I was sleeping."],"a":"Sure!","tr":"Para aceitar uma sugestao podemos dizer 'Sure!' ou 'Good idea!'.","tip":"Aceitar sugestao: <b>Sure!</b>"},{"s":"time","t":"animais","q":"There are 60 minutes in one ___.","opts":["hour","minute","shadow","week"],"a":"hour","tr":"Hour = hora; uma hora tem 60 minutos.","tip":"<b>hour</b> = hora (60 minutos)."},{"s":"cal","t":"animais","q":"It is cold and the animals have thick fur. Which season is it?","opts":["winter","summer","spring","fall"],"a":"winter","tr":"Winter = inverno, a estacao mais fria.","tip":"<b>winter</b> = inverno (frio)."},{"s":"inst","t":"animais","q":"At the jungle party the monkeys had a ___ and played music all night.<br>(grupo que toca musica junto)","opts":["band","minute","season","alarm"],"a":"band","tr":"Na festa da selva os macacos tinham uma banda e tocavam musica a noite toda. 'Band' = banda (grupo musical).","tip":"band = banda; concert = show; tune = melodia; rhythm = ritmo."},{"s":"emo","t":"animais","q":"A part of the safari movie is called a ___.","opts":["scene","rhythm","season","minute"],"a":"scene","tr":"Scene = cena, uma parte do filme.","tip":"<b>scene</b> = cena."},{"s":"pastc","t":"animais","q":"Two actions at the same time:<br>The bird was flying ___ the snake was sleeping.","opts":["while","when","after","before"],"a":"while","tr":"Usamos <b>while</b> para duas acoes continuas ao mesmo tempo.","tip":"duas acoes -ing juntas &rarr; <b>while</b>."},{"s":"sugg","t":"animais","q":"Which sentence is a suggestion?","opts":["Who wants to ride the safari jeep?","The jeep is green.","I see a lion.","The lion is sleeping."],"a":"Who wants to ride the safari jeep?","tr":"'Who wants to...?' e uma forma de fazer um convite/sugestao.","tip":"<b>Who wants to</b> + verbo = sugestao."},{"s":"time","t":"animais","q":"The lion woke up two hours ___. It happened in the past.","opts":["ago","early","late","o'clock"],"a":"ago","tr":"Ago = atras (no passado). 'Two hours ago' = duas horas atras.","tip":"<b>ago</b> = atras (passado)."},{"s":"cal","t":"animais","q":"Choose the correct order of seasons:","opts":["spring, summer, fall, winter","winter, fall, summer, spring","summer, spring, winter, fall","fall, spring, winter, summer"],"a":"spring, summer, fall, winter","tr":"A ordem das estacoes: spring (primavera), summer (verao), fall (outono), winter (inverno).","tip":"spring &rarr; summer &rarr; fall &rarr; winter."},{"s":"inst","t":"herois","q":"The hero plays the drums at the concert. How do you play a <b>drum</b>?","opts":["You hit it with sticks","You blow into it","You press its keys","You pull its strings"],"a":"You hit it with sticks","tr":"Tocar bateria (drum) = bater com baquetas ou com as mãos.","tip":"<b>drum</b> = bater. <b>trumpet</b> = soprar. <b>piano</b> = teclas. <b>violin/guitar</b> = cordas."},{"s":"emo","t":"herois","q":"The hero flies very ___, not slow. The opposite of slow is ___.","opts":["fast","soft","sad","low"],"a":"fast","tr":"O contrário de slow (devagar) é fast (rápido).","tip":"fast (rápido) ↔ slow (devagar)."},{"s":"pastc","t":"herois","q":"The hero ___ flying over the city last night.","opts":["was","were","is","are"],"a":"was","tr":"Past continuous: he/she/it usa was + verbo-ING.","tip":"I/he/she/it → <b>was</b>; you/we/they → <b>were</b>."},{"s":"sugg","t":"herois","q":"Which sentence is a <b>suggestion</b>?","opts":["Let's save the city!","The city is big.","Where is the villain?","He has a cape."],"a":"Let's save the city!","tr":"Sugestão = convite para fazer algo juntos. 'Let's + verbo' é uma sugestão.","tip":"<b>Let's + verbo</b> = sugestão."},{"s":"time","t":"herois","q":"The hero saves the city at <b>midday</b>. What time is midday?","opts":["12:00 in the day","12:00 at night","6:00 in the morning","3:00 in the day"],"a":"12:00 in the day","tr":"Midday = meio-dia, 12:00 (de dia).","tip":"<b>midday</b> = meio-dia (12:00)."},{"s":"cal","t":"herois","q":"The hero patrols the city every day. He patrols ___.","opts":["daily","weekly","monthly","yearly"],"a":"daily","tr":"day → daily (diariamente / todos os dias).","tip":"<b>day → daily</b>."},{"s":"inst","t":"herois","q":"Captain Sky has super lungs. Which instrument do you <b>blow</b> into?","opts":["trumpet","violin","piano","guitar"],"a":"trumpet","tr":"O trompete (trumpet) é de metal e se toca soprando.","tip":"<b>trumpet</b> = soprar, é de metal (brass)."},{"s":"emo","t":"herois","q":"The villain's roar is very ___. The opposite of soft is ___.","opts":["loud","slow","happy","high"],"a":"loud","tr":"O contrário de soft (baixo/suave) é loud (alto/barulhento).","tip":"loud (alto) ↔ soft (suave/baixo)."},{"s":"pastc","t":"herois","q":"The two heroes ___ saving the city all morning.","opts":["were","was","is","am"],"a":"were","tr":"Past continuous: they usa were + verbo-ING.","tip":"you/we/they → <b>were</b>."},{"s":"sugg","t":"herois","q":"___ we fly to the headquarters?","opts":["Why don't","Let's","Who is","What is"],"a":"Why don't","tr":"'Why don't we + verbo?' é uma forma de fazer sugestão.","tip":"<b>Why don't we + verbo?</b> = sugestão."},{"s":"time","t":"herois","q":"The villain attacks at <b>midnight</b>. What time is midnight?","opts":["12:00 at night","12:00 in the day","1:00 in the day","9:00 at night"],"a":"12:00 at night","tr":"Midnight = meia-noite, 12:00 (à noite).","tip":"<b>midnight</b> = meia-noite (12:00)."},{"s":"cal","t":"herois","q":"The hero team meets every week. They meet ___.","opts":["weekly","daily","monthly","yearly"],"a":"weekly","tr":"week → weekly (semanalmente / toda semana).","tip":"<b>week → weekly</b>."},{"s":"inst","t":"herois","q":"The flying hero uses a bow on the strings. Which instrument is it?","opts":["violin","drum","trumpet","piano"],"a":"violin","tr":"O violino (violin) se toca com um arco (bow) sobre as cordas.","tip":"<b>violin</b> = arco + cordas."},{"s":"emo","t":"herois","q":"The hero sings a ___ note, not a low one. The opposite of low is ___.","opts":["high","sad","slow","soft"],"a":"high","tr":"O contrário de low (grave/baixo) é high (agudo/alto).","tip":"high (agudo) ↔ low (grave)."},{"s":"pastc","t":"herois","q":"I ___ wearing my cape when the alarm rang.","opts":["was","were","is","are"],"a":"was","tr":"Past continuous: I usa was + verbo-ING.","tip":"I → <b>was</b>."},{"s":"sugg","t":"herois","q":"Let's ___ the city from the villain!","opts":["save","saving","saved","saves"],"a":"save","tr":"Depois de 'Let's' usamos o verbo na forma base (sem -ing/-s/-ed).","tip":"<b>Let's + verbo base</b>."},{"s":"time","t":"herois","q":"The hero's clock shows 3:30. We say ___.","opts":["half past three","quarter past three","three o'clock","half past four"],"a":"half past three","tr":"3:30 = half past three (e trinta / meia hora depois das três).","tip":"X:30 = <b>half past</b> X."},{"s":"cal","t":"herois","q":"The hero cleans the headquarters every month. He cleans it ___.","opts":["monthly","daily","weekly","yearly"],"a":"monthly","tr":"month → monthly (mensalmente / todo mês).","tip":"<b>month → monthly</b>."},{"s":"inst","t":"herois","q":"At the headquarters, the hero presses black and white keys. The instrument is a ___.","opts":["piano","violin","drum","trumpet"],"a":"piano","tr":"O piano tem teclas (keys) pretas e brancas.","tip":"<b>piano</b> = teclas (keys)."},{"s":"emo","t":"herois","q":"Before the big fight the hero is ___, not relaxed. The opposite of relaxed is ___.","opts":["excited","calm","soft","slow"],"a":"excited","tr":"O contrário de relaxed (relaxado) é excited (agitado/empolgado).","tip":"relaxed (relaxado) ↔ excited (agitado)."},{"s":"pastc","t":"herois","q":"Choose the correct sentence (past continuous).","opts":["She was flying to the city.","She were flying to the city.","She flying was to the city.","She was fly to the city."],"a":"She was flying to the city.","tr":"Past continuous = was/were + verbo terminado em -ING.","tip":"was/were + verbo + <b>-ing</b>."},{"s":"sugg","t":"herois","q":"___ wants to help the hero?","opts":["Who","Let's","Why","When"],"a":"Who","tr":"'Who wants to + verbo?' é uma sugestão/convite.","tip":"<b>Who wants to + verbo?</b> = sugestão."},{"s":"time","t":"herois","q":"The training starts at 7:15. We say ___.","opts":["quarter past seven","half past seven","seven o'clock","quarter past eight"],"a":"quarter past seven","tr":"7:15 = quarter past seven (e quinze).","tip":"X:15 = <b>quarter past</b> X."},{"s":"cal","t":"herois","q":"The city gives the hero a prize every year. They give it ___.","opts":["yearly","daily","weekly","monthly"],"a":"yearly","tr":"year → yearly (anualmente / todo ano).","tip":"<b>year → yearly</b>."},{"s":"inst","t":"herois","q":"The young hero plays six strings with her fingers. The instrument is a ___.","opts":["guitar","piano","trumpet","drum"],"a":"guitar","tr":"A guitarra/violão (guitar) tem cordas que se tocam com os dedos.","tip":"<b>guitar</b> = cordas."},{"s":"emo","t":"herois","q":"A ___ scene in the hero movie has slow, calm music.","opts":["calm","scary","fast","loud"],"a":"calm","tr":"Uma cena calma (calm scene) tem música lenta e tranquila.","tip":"Cena calma = música <b>slow</b> e <b>calm</b>."},{"s":"pastc","t":"herois","q":"Negative: The villain ___ hiding in the building.","opts":["wasn't","weren't","isn't","aren't"],"a":"wasn't","tr":"Negativa no past continuous: he/she/it usa wasn't + verbo-ING.","tip":"he/she/it → <b>wasn't</b>; you/we/they → <b>weren't</b>."},{"s":"sugg","t":"herois","q":"A hero says 'Let's stop the villain!' A good reply is ___.","opts":["Good idea!","I am ten.","It is blue.","The cape is big."],"a":"Good idea!","tr":"Respondemos a uma sugestão com 'Good idea!' ou 'Sure!'.","tip":"Responder sugestão: <b>Good idea! / Sure!</b>"},{"s":"time","t":"herois","q":"The hero flies off at 8:00. We say ___.","opts":["eight o'clock","half past eight","quarter past eight","midday"],"a":"eight o'clock","tr":"8:00 = eight o'clock (oito em ponto).","tip":"X:00 = X <b>o'clock</b>."},{"s":"cal","t":"herois","q":"First the villain comes, ___ the fight, the hero rests after.","opts":["during","before","after","ago"],"a":"during","tr":"during = durante (no meio do evento).","tip":"before (antes) → during (durante) → after (depois)."},{"s":"inst","t":"herois","q":"A group of heroes who play music together is a ___.","opts":["band","stage","tune","concert"],"a":"band","tr":"Band = banda, um grupo de pessoas que tocam música juntas.","tip":"<b>band</b> = banda (grupo). <b>concert</b> = o show."},{"s":"emo","t":"herois","q":"When the villain appears, the ___ scene has loud, fast music.","opts":["scary","calm","happy","soft"],"a":"scary","tr":"Uma cena assustadora (scary scene) tem música alta e rápida.","tip":"Cena assustadora = música <b>loud</b> e <b>fast</b>."},{"s":"pastc","t":"herois","q":"Negative: The heroes ___ sleeping during the attack.","opts":["weren't","wasn't","isn't","don't"],"a":"weren't","tr":"Negativa no past continuous: they usa weren't + verbo-ING.","tip":"you/we/they → <b>weren't</b>."},{"s":"sugg","t":"herois","q":"Which sentence is NOT a suggestion?","opts":["The hero is strong.","Let's fly now!","Why don't we run?","Who wants to help?"],"a":"The hero is strong.","tr":"'The hero is strong' é uma afirmação, não uma sugestão.","tip":"Afirmação descreve; sugestão convida a fazer algo."},{"s":"time","t":"herois","q":"An old clock that uses the sun and a shadow is a ___.","opts":["sundial","hourglass","cellphone","calendar"],"a":"sundial","tr":"sun + dial = sundial (relógio de sol, usa a sombra).","tip":"<b>sun + dial = sundial</b>."},{"s":"cal","t":"herois","q":"The hero puts on his cape ___ he flies. (first the cape, then flying)","opts":["before","after","during","ago"],"a":"before","tr":"before = antes (a capa vem antes de voar).","tip":"<b>before</b> = antes."},{"s":"inst","t":"herois","q":"The heroes stand on the ___ to play in front of the city.","opts":["stage","cape","villain","rhythm"],"a":"stage","tr":"Stage = palco, onde a banda fica para tocar.","tip":"<b>stage</b> = palco."},{"s":"emo","t":"herois","q":"The music in a movie is called the ___.","opts":["soundtrack","stage","band","shadow"],"a":"soundtrack","tr":"Soundtrack = trilha sonora, a música de um filme.","tip":"<b>soundtrack</b> = trilha sonora."},{"s":"pastc","t":"herois","q":"Question: ___ you using your super-strength then?","opts":["Were","Was","Did","Are"],"a":"Were","tr":"Pergunta no past continuous: Was/Were + sujeito + verbo-ING? Com 'you' usamos Were.","tip":"you/we/they → <b>Were ...?</b>"},{"s":"sugg","t":"herois","q":"Why don't we ___ the city tonight?","opts":["protect","protecting","protects","protected"],"a":"protect","tr":"Depois de 'Why don't we' usamos o verbo na forma base.","tip":"<b>Why don't we + verbo base?</b>"},{"s":"time","t":"herois","q":"A clock with sand that falls is an ___.","opts":["hourglass","sundial","cellphone","alarm clock"],"a":"hourglass","tr":"hour + glass = hourglass (ampulheta, com areia).","tip":"<b>hour + glass = hourglass</b>."},{"s":"cal","t":"herois","q":"The hero eats ___ he saves the city. (first saving, then eating)","opts":["after","before","during","ago"],"a":"after","tr":"after = depois (comer vem depois de salvar).","tip":"<b>after</b> = depois."},{"s":"inst","t":"herois","q":"Tonight the super-band will ___ on stage for the city.","opts":["perform","save","fly","hide"],"a":"perform","tr":"Perform = tocar/apresentar para uma plateia.","tip":"<b>perform</b> = apresentar-se para o público."},{"s":"emo","t":"herois","q":"Happiness and fear are kinds of ___.","opts":["emotion","instrument","calendar","stage"],"a":"emotion","tr":"Emotion = emoção; alegria e medo são emoções.","tip":"<b>emotion</b> = emoção. <b>feeling</b> = sentimento."},{"s":"pastc","t":"herois","q":"Question: ___ the hero saving the bus at noon?","opts":["Was","Were","Did","Is"],"a":"Was","tr":"Pergunta no past continuous: he/she/it usa Was + sujeito + verbo-ING?","tip":"he/she/it → <b>Was ...?</b>"},{"s":"sugg","t":"herois","q":"Choose the best suggestion to fight the villain together.","opts":["Let's catch the villain!","The villain is bad.","Where is the villain?","I see a villain."],"a":"Let's catch the villain!","tr":"'Let's catch the villain!' é a única sugestão (convite a agir juntos).","tip":"Sugestão começa com Let's / Why don't we / Who wants to."},{"s":"time","t":"herois","q":"The hero woke up to the loud ___ that rang at six.","opts":["alarm clock","shadow","season","stage"],"a":"alarm clock","tr":"alarm clock = despertador, o relógio que toca para acordar.","tip":"<b>alarm clock</b> = despertador."},{"s":"cal","t":"herois","q":"The hero loves the warm season with sun and the beach: ___.","opts":["summer","winter","spring","fall"],"a":"summer","tr":"summer = verão, a estação quente.","tip":"<b>summer</b> = verão."},{"s":"inst","t":"herois","q":"The hero loves the song's ___, the nice melody he can hum.","opts":["tune","stage","band","villain"],"a":"tune","tr":"Tune = melodia, a parte cantarolável da música.","tip":"<b>tune</b> = melodia."},{"s":"emo","t":"herois","q":"When the city is saved, everyone is ___.","opts":["happy","sad","scary","low"],"a":"happy","tr":"Quando a cidade é salva, todos ficam felizes (happy).","tip":"<b>happy</b> = feliz."},{"s":"pastc","t":"herois","q":"The hero was flying ___ the villain was running away.","opts":["while","ago","early","during"],"a":"while","tr":"Usamos 'while' para duas ações contínuas ao mesmo tempo.","tip":"<b>while</b> = duas ações contínuas juntas."},{"s":"sugg","t":"herois","q":"Friend: 'Why don't we save the bus?' Hero: '___'","opts":["Sure!","It is red.","He is tall.","Five o'clock."],"a":"Sure!","tr":"'Sure!' é uma boa resposta para aceitar uma sugestão.","tip":"Aceitar sugestão: <b>Sure! / Good idea!</b>"},{"s":"time","t":"herois","q":"The hero saved the city two hours ___.","opts":["ago","early","late","before"],"a":"ago","tr":"ago = atrás (tempo no passado): two hours ago = duas horas atrás.","tip":"<b>ago</b> = atrás (passado)."},{"s":"cal","t":"herois","q":"The season when flowers grow and the city is green is ___.","opts":["spring","winter","summer","fall"],"a":"spring","tr":"spring = primavera, quando as flores nascem.","tip":"<b>spring</b> = primavera."},{"s":"inst","t":"herois","q":"The hero plays music to calm the city. He uses a bow on his <b>violin</b>. To play the violin, you ___ it.","opts":["bow","hit","blow","press"],"a":"bow","tr":"O herói toca para acalmar a cidade. Ele usa um arco no violino. Para tocar violino, voce usa o arco (bow).","tip":"violin = arco (bow); drum = bater (hit); trumpet = soprar (blow); piano = teclas (press)."},{"s":"emo","t":"herois","q":"The villain's lair is dark and full of strange sounds. It feels very ___ . The opposite of <b>calm</b>.","opts":["scary","soft","relaxed","happy"],"a":"scary","tr":"O esconderijo do vilao e escuro e cheio de sons estranhos. Parece muito ___ . O oposto de calmo.","tip":"scary = assustador; soft = suave; relaxed = relaxado; happy = feliz."},{"s":"pastc","t":"herois","q":"The hero was sleeping ___ the alarm rang.","opts":["when","while","before","ago"],"a":"when","tr":"Usamos 'when' quando uma ação contínua é interrompida por uma ação rápida (past simple).","tip":"<b>when</b> + past simple interrompe o past continuous."},{"s":"sugg","t":"herois","q":"Who wants to ___ the secret identity?","opts":["keep","keeping","keeps","kept"],"a":"keep","tr":"Depois de 'Who wants to' usamos o verbo na forma base.","tip":"<b>Who wants to + verbo base?</b>"},{"s":"time","t":"herois","q":"The hero's mission starts exactly at twelve in the day. We can also say it starts at ___ .","opts":["midday","midnight","an hour","a minute"],"a":"midday","tr":"A missao do herói comeca exatamente ao meio-dia. Tambem podemos dizer que comeca ao ___ .","tip":"midday = meio-dia; midnight = meia-noite; hour = hora; minute = minuto."},{"s":"cal","t":"herois","q":"The super team trains every week to stay strong. They train ___ .","opts":["weekly","daily","yearly","monthly"],"a":"weekly","tr":"O super-time treina toda semana para ficar forte. Eles treinam ___ (semanalmente).","tip":"Adverbios -ly: daily (todo dia), weekly (toda semana), monthly (todo mes), yearly (todo ano)."}];

const SUBJECT_LABELS = {
  inst:'INSTRUMENTOS & MÚSICA', emo:'EMOÇÕES & ANTÔNIMOS', pastc:'PAST CONTINUOUS',
  sugg:'SUGESTÕES & FUNÇÕES', time:'HORAS & RELÓGIOS', cal:'CALENDÁRIO & TEMPO'
};
const THEME_LABELS = {
  futebol:'⚽ COPA DO MUNDO', espaco:'🚀 ESPAÇO', dino:'🦖 DINOSSAUROS',
  games:'🎮 VIDEO GAMES', animais:'🐾 ANIMAIS', herois:'🦸 SUPER-HERÓIS'
};

// ======================= MOTOR =======================
let TOTAL_Q = 10, subjectKey = 'tudo', themeKey = 'tudo', userEmail = '', currentQ = 0, score = 0;
let round = [], selected = null, ready = false;

function shuffle(arr){ const a=[...arr]; for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

function fullPool(){
  return QUESTIONS.filter(q => (subjectKey==='tudo'||q.s===subjectKey) && (themeKey==='tudo'||q.t===themeKey));
}
function updatePoolNote(){
  document.getElementById('poolNote').textContent = `${fullPool().length} perguntas disponíveis com estes filtros.`;
}

function selectSubject(btn,key){
  subjectKey = key;
  document.querySelectorAll('button[onclick^="selectSubject"]').forEach(b=>b.classList.remove('selected'));
  btn.classList.add('selected');
  updatePoolNote();
}
function selectTheme(btn,key){
  themeKey = key;
  document.querySelectorAll('button[onclick^="selectTheme"]').forEach(b=>b.classList.remove('selected'));
  btn.classList.add('selected');
  updatePoolNote();
}
function selectQty(btn,n){
  TOTAL_Q = n;
  document.querySelectorAll('button[onclick^="selectQty"]').forEach(b=>b.classList.remove('selected'));
  btn.classList.add('selected');
}

function start(){
  userEmail = (document.getElementById('emailInput').value || '').trim();
  currentQ = 0; score = 0;
  const pool = fullPool();
  round = shuffle(pool).slice(0, Math.min(TOTAL_Q, pool.length));
  document.getElementById('headerArea').classList.add('hidden');
  document.getElementById('startScreen').classList.add('hidden');
  document.getElementById('finalScreen').classList.add('hidden');
  document.getElementById('quizScreen').classList.remove('hidden');
  showQuestion();
}

function showQuestion(){
  const item = round[currentQ];
  item.__opts = shuffle(item.opts);
  document.getElementById('scoreDisplay').textContent = `Score: ${score} / ${currentQ}`;
  document.getElementById('progressFill').style.width = (currentQ / round.length * 100) + '%';
  const html = `
    <div class="question-card">
      <div class="subject-tag">${SUBJECT_LABELS[item.s]} &middot; ${THEME_LABELS[item.t]||''}</div>
      <div class="question-number">Question ${currentQ+1} of ${round.length}</div>
      <div class="question-text">${item.q}</div>
      <div class="options">
        ${item.__opts.map(o=>`<button class="option-btn" data-value="${o.replace(/"/g,'&quot;')}" onclick="selectOption(this)">${o}</button>`).join('')}
      </div>
      <button class="submit-btn" id="submitBtn" onclick="checkAnswer()" disabled>ANSWER</button>
      <div id="feedbackArea"></div>
    </div>`;
  document.getElementById('questionArea').innerHTML = html;
  selected = null; ready = true;
  window.scrollTo(0,0);
}

function selectOption(btn){
  if(!ready) return;
  document.querySelectorAll('.option-btn').forEach(b=>b.classList.remove('selected'));
  btn.classList.add('selected');
  selected = btn.dataset.value;
  document.getElementById('submitBtn').disabled = false;
}

function checkAnswer(){
  if(selected===null) return;
  ready = false;
  const item = round[currentQ];
  const isCorrect = selected === item.a;

  document.querySelectorAll('.option-btn').forEach(btn=>{
    btn.style.pointerEvents='none';
    if(btn.dataset.value===item.a) btn.classList.add('correct');
    else if(btn.dataset.value===selected && !isCorrect) btn.classList.add('wrong');
  });

  if(isCorrect) score++;
  document.getElementById('scoreDisplay').textContent = `Score: ${score} / ${currentQ+1}`;
  document.getElementById('submitBtn').classList.add('hidden');

  const last = currentQ >= round.length-1;
  const nextLabel = last ? 'SEE RESULT &#127942;' : 'NEXT &#10132;';
  document.getElementById('feedbackArea').innerHTML = `
    <button class="next-btn" onclick="nextQuestion()">${nextLabel}</button>
    <div class="feedback ${isCorrect?'correct':'wrong'}">
      <div class="feedback-icon">${isCorrect?'&#10024; CORRECT! &#10024;':'&#10060; Not quite!'}</div>
      <div class="answer-line">Resposta certa: <strong>${item.a}</strong></div>
      <div class="info-block">
        <span class="blk-label">TRADUÇÃO / EXPLICAÇÃO</span>
        <span class="info-trans">${item.tr}</span>
        <div class="info-tip"><b>Dica:</b> ${item.tip}</div>
      </div>
    </div>
    <button class="next-btn" onclick="nextQuestion()">${nextLabel}</button>`;
  selected = null;
  window.scrollTo(0,0);
}

function nextQuestion(){
  currentQ++;
  window.scrollTo(0,0);
  if(currentQ < round.length) showQuestion();
  else showFinal();
}

function showFinal(){
  document.getElementById('quizScreen').classList.add('hidden');
  const final = document.getElementById('finalScreen');
  final.classList.remove('hidden');
  const pct = Math.round(score / round.length * 100);
  let cls, emoji, msg;
  if(pct>=80){ cls='great'; emoji='&#127775;'; msg='Excellent! You are an English star!'; }
  else if(pct>=50){ cls='good'; emoji='&#128170;'; msg='Good job! Keep practicing and you will master it!'; }
  else { cls='try-again'; emoji='&#128218;'; msg='Keep studying — try again, you can do it!'; }
  const subjName = subjectKey==='tudo' ? 'Tudo' : SUBJECT_LABELS[subjectKey];

  final.innerHTML = `
    <div class="final-screen">
      <h1>RESULT</h1>
      <div style="font-size:3em">${emoji}</div>
      <div class="final-score ${cls}">${score}/${round.length}</div>
      <div class="final-msg">${msg}</div>
      <div style="color:#8888cc;margin-bottom:20px">Assunto: ${subjName} | Acerto: ${pct}%</div>
      ${userEmail?`<div id="emailStatus" style="color:#6bff6b;margin-bottom:15px;font-size:0.85em">Preparando e-mail para ${userEmail}...</div>`:''}
      <button class="restart-btn" onclick="start()">PLAY AGAIN</button>
      <button class="restart-btn" onclick="backToStart()">CHANGE TOPIC</button>
    </div>`;
  if(userEmail) sendResult(pct, subjName);
}

function sendResult(pct, subjName){
  const subject = encodeURIComponent(`QuizX - Inglês: ${score}/${round.length} (${pct}%)`);
  const lines = [`QuizX - Inglês 4º ano (Caps. 3 e 4)`, ``, `Assunto: ${subjName}`, `Resultado: ${score}/${round.length} (${pct}%)`, ``, `Perguntas da rodada:`];
  round.forEach((it,i)=>lines.push(`${i+1}. ${it.q.replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim()}  ->  ${it.a}`));
  lines.push(``, `---`, `Enviado por QuizX`);
  const body = encodeURIComponent(lines.join('\n'));
  window.open(`mailto:${userEmail}?subject=${subject}&body=${body}`, '_blank');
  const st = document.getElementById('emailStatus');
  if(st) st.textContent = `E-mail preparado para ${userEmail}!`;
}

function backToStart(){
  document.getElementById('headerArea').classList.remove('hidden');
  document.getElementById('finalScreen').classList.add('hidden');
  document.getElementById('quizScreen').classList.add('hidden');
  document.getElementById('startScreen').classList.remove('hidden');
}

updatePoolNote();
</script>
</body>
</html>
