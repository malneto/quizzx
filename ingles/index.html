<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QuizX - Inglês 4º ano (Caps. 3 e 4)</title>
<link rel="icon" type="image/svg+xml" href="../favicon.svg">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Space+Mono:wght@400;700&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Space Mono', monospace; background: #0a0a2e; color: #e0e0ff; min-height: 100vh; }
  .container { max-width: 800px; margin: 0 auto; padding: 20px; }
  h1 {
    font-family: 'Orbitron', sans-serif; text-align: center; font-size: 1.7em;
    background: linear-gradient(90deg, #ff6b6b, #ffd93d, #6bff6b, #6bb5ff, #d96bff);
    background-size: 300% 300%; -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    animation: rainbow 4s ease infinite; margin-bottom: 8px;
  }
  @keyframes rainbow { 0%{background-position:0% 50%} 50%{background-position:100% 50%} 100%{background-position:0% 50%} }
  .subtitle { text-align: center; color: #8888cc; font-size: 0.9em; margin-bottom: 25px; }
  .back-link { display: inline-block; color: #6bb5ff; text-decoration: none; font-size: 0.85em; margin-bottom: 15px; }
  .back-link:hover { color: #99ccff; }

  .label { font-family:'Orbitron',sans-serif; font-size:0.8em; color:#6bb5ff; margin-bottom:10px; text-align:center; }
  .modes { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-bottom: 22px; }
  .qty-btn {
    font-family: 'Orbitron', sans-serif; padding: 10px 18px; border: 2px solid #4a4a8e; border-radius: 10px;
    background: transparent; color: #c0c0ff; font-size: 0.78em; cursor: pointer; transition: all 0.3s;
  }
  .qty-btn:hover { border-color: #ffd93d; color: #ffd93d; }
  .qty-btn.selected { border-color: #6bff6b; color: #6bff6b; background: rgba(107,255,107,0.1); }

  .start-btn {
    font-family: 'Orbitron', sans-serif; display:block; width:100%; max-width:360px; margin:10px auto 0; padding: 16px;
    background: linear-gradient(135deg, #4a4a8e, #6a4aae); border: none; border-radius: 12px;
    color: white; font-size: 1em; cursor: pointer; transition: all 0.3s; text-transform: uppercase; letter-spacing: 2px;
  }
  .start-btn:hover { background: linear-gradient(135deg, #6a6aae, #8a6ace); box-shadow: 0 0 20px rgba(150,100,255,0.4); }

  .email-input {
    font-family: 'Space Mono', monospace; width: 100%; max-width: 360px; padding: 10px 15px;
    background: #0d0d3a; border: 2px solid #4a4a8e; border-radius: 10px; color: #fff; font-size: 0.9em;
    outline: none; transition: border-color 0.3s; text-align: center;
  }
  .email-input:focus { border-color: #ffd93d; }
  .email-input::placeholder { color: #5555aa; }

  .progress-bar { width: 100%; height: 8px; background: #1a1a4e; border-radius: 4px; margin-bottom: 15px; overflow: hidden; }
  .progress-fill { height: 100%; background: linear-gradient(90deg, #6bff6b, #ffd93d, #ff6b6b); border-radius: 4px; transition: width 0.5s ease; }
  .score-display { text-align: center; font-family: 'Orbitron', sans-serif; font-size: 0.95em; color: #ffd93d; margin-bottom: 12px; }

  .question-card {
    background: linear-gradient(135deg, #1a1a4e, #2a1a5e); border: 2px solid #3a3a8e; border-radius: 20px;
    padding: 25px; box-shadow: 0 0 40px rgba(100, 100, 255, 0.1);
  }
  .question-number { font-family: 'Orbitron', sans-serif; font-size: 0.85em; color: #6bb5ff; margin-bottom: 8px; }
  .subject-tag { font-family:'Orbitron',sans-serif; font-size:0.68em; color:#d96bff; text-align:right; margin-bottom:6px; letter-spacing:1px; }
  .question-text { font-size: 1.12em; line-height: 1.55; margin-bottom: 20px; color: #fff; text-align: center; }

  .options { display: flex; flex-direction: column; gap: 8px; }
  .option-btn {
    font-family: 'Space Mono', monospace; padding: 14px 18px; background: #0d0d3a; border: 2px solid #4a4a8e;
    border-radius: 12px; color: #c0c0ff; font-size: 0.98em; cursor: pointer; transition: all 0.3s; text-align: left;
  }
  .option-btn:hover { border-color: #8888ff; background: #1a1a5e; transform: translateX(5px); }
  .option-btn.selected { border-color: #ffd93d; background: #2a2a3e; }
  .option-btn.correct { border-color: #6bff6b !important; background: rgba(107,255,107,0.15) !important; color: #6bff6b !important; }
  .option-btn.wrong { border-color: #ff6b6b !important; background: rgba(255,107,107,0.15) !important; color: #ff6b6b !important; }

  .submit-btn {
    font-family: 'Orbitron', sans-serif; display: block; width: 100%; margin-top: 15px; padding: 14px;
    background: linear-gradient(135deg, #4a4a8e, #6a4aae); border: none; border-radius: 12px;
    color: white; font-size: 1em; cursor: pointer; transition: all 0.3s; text-transform: uppercase; letter-spacing: 2px;
  }
  .submit-btn:hover:not(:disabled) { background: linear-gradient(135deg, #6a6aae, #8a6ace); box-shadow: 0 0 20px rgba(150,100,255,0.4); }
  .submit-btn:disabled { opacity: 0.3; cursor: not-allowed; }

  .feedback { margin-top: 18px; padding: 18px; border-radius: 15px; animation: fadeIn 0.5s ease; }
  .feedback.correct { background: rgba(107,255,107,0.1); border: 2px solid #6bff6b; }
  .feedback.wrong { background: rgba(255,107,107,0.1); border: 2px solid #ff6b6b; }
  .feedback-icon { font-size: 1.3em; text-align: center; margin-bottom: 10px; }
  .answer-line { text-align:center; font-size:1.05em; color:#fff; margin-bottom:12px; }
  .answer-line strong { color:#6bff6b; }

  .info-block { margin-top: 10px; background: rgba(10,10,46,0.5); border-radius: 10px; padding: 12px 14px; font-size: 0.88em; line-height: 1.55; }
  .info-block .blk-label { color:#ffd93d; font-family:'Orbitron',sans-serif; font-size:0.72em; letter-spacing:1px; display:block; margin-bottom:4px; }
  .info-trans { color:#cfcff5; }
  .info-tip { color:#aaccff; margin-top:10px; padding-top:10px; border-top:1px solid rgba(100,100,200,0.2); font-style: italic; }

  .next-btn {
    font-family: 'Orbitron', sans-serif; display: block; width: 100%; margin-top: 12px; padding: 14px;
    background: linear-gradient(135deg, #2a8a2a, #3aaa3a); border: none; border-radius: 12px;
    color: white; font-size: 0.95em; cursor: pointer; text-transform: uppercase; letter-spacing: 2px; transition: all 0.3s;
  }
  .next-btn:hover { background: linear-gradient(135deg, #3aaa3a, #4aca4a); }

  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

  .final-screen { text-align: center; padding: 40px 20px; }
  .final-score { font-family: 'Orbitron', sans-serif; font-size: 3.5em; margin: 20px 0; }
  .final-score.great { color: #6bff6b; }
  .final-score.good { color: #ffd93d; }
  .final-score.try-again { color: #ff6b6b; }
  .final-msg { font-size: 1.1em; margin-bottom: 25px; line-height: 1.6; }
  .restart-btn {
    font-family: 'Orbitron', sans-serif; padding: 14px 30px; background: linear-gradient(135deg, #6b4aff, #9b6bff);
    border: none; border-radius: 15px; color: white; font-size: 0.9em; cursor: pointer; text-transform: uppercase;
    letter-spacing: 2px; transition: all 0.3s; margin: 5px;
  }
  .restart-btn:hover { box-shadow: 0 0 30px rgba(150,100,255,0.5); transform: scale(1.05); }

  .hidden { display: none; }

  @media (max-width: 600px) {
    h1 { font-size: 1.25em; }
    .qty-btn { padding: 9px 13px; font-size: 0.7em; }
    .question-card { padding: 16px; }
    .option-btn { padding: 11px 14px; font-size: 0.9em; }
    .question-text { font-size: 1em; margin-bottom: 14px; }
  }
</style>
</head>
<body>
<div class="container">
  <div id="headerArea">
    <a href="../index.html" class="back-link">&larr; QuizX</a>
    <h1>INGLÊS &mdash; 4º ANO</h1>
    <p class="subtitle">Capítulos 3 (Music) e 4 (Time) &mdash; vocabulário, gramática e funções</p>
  </div>

  <!-- Start -->
  <div id="startScreen">
    <div style="text-align:center;margin-bottom:18px">
      <div class="label">RECEBER RESULTADO POR E-MAIL (opcional)</div>
      <input type="email" id="emailInput" class="email-input" placeholder="seu@email.com">
    </div>

    <div class="label">ESCOLHA O ASSUNTO</div>
    <div class="modes">
      <button class="qty-btn selected" onclick="selectSubject(this,'tudo')">🌐 Tudo</button>
      <button class="qty-btn" onclick="selectSubject(this,'inst')">🎵 Instrumentos &amp; Música</button>
      <button class="qty-btn" onclick="selectSubject(this,'emo')">🎭 Emoções &amp; Antônimos</button>
      <button class="qty-btn" onclick="selectSubject(this,'pastc')">⏪ Past Continuous</button>
      <button class="qty-btn" onclick="selectSubject(this,'sugg')">💬 Sugestões &amp; Funções</button>
      <button class="qty-btn" onclick="selectSubject(this,'time')">⏰ Horas &amp; Relógios</button>
      <button class="qty-btn" onclick="selectSubject(this,'cal')">📅 Calendário &amp; Tempo</button>
    </div>

    <div class="label">ESCOLHA O TEMA (cenário)</div>
    <div class="modes">
      <button class="qty-btn selected" onclick="selectTheme(this,'tudo')">🎲 Todos</button>
      <button class="qty-btn" onclick="selectTheme(this,'futebol')">⚽ Copa do Mundo</button>
      <button class="qty-btn" onclick="selectTheme(this,'espaco')">🚀 Espaço</button>
      <button class="qty-btn" onclick="selectTheme(this,'dino')">🦖 Dinossauros</button>
      <button class="qty-btn" onclick="selectTheme(this,'games')">🎮 Video Games</button>
      <button class="qty-btn" onclick="selectTheme(this,'animais')">🐾 Animais</button>
      <button class="qty-btn" onclick="selectTheme(this,'herois')">🦸 Super-heróis</button>
    </div>

    <div class="label">QUANTAS PERGUNTAS?</div>
    <div class="modes">
      <button class="qty-btn selected" onclick="selectQty(this,10)">10</button>
      <button class="qty-btn" onclick="selectQty(this,20)">20</button>
      <button class="qty-btn" onclick="selectQty(this,30)">30</button>
      <button class="qty-btn" onclick="selectQty(this,50)">50</button>
    </div>

    <button class="start-btn" onclick="start()">START &#10132;</button>
    <div id="poolNote" style="text-align:center;color:#8888cc;font-size:0.8em;margin-top:12px"></div>
  </div>

  <!-- Quiz -->
  <div id="quizScreen" class="hidden">
    <div class="score-display" id="scoreDisplay">Score: 0 / 0</div>
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    <div id="questionArea"></div>
  </div>

  <!-- Final -->
  <div id="finalScreen" class="hidden"></div>
</div>

<script>
// ======================= BANCO DE QUESTÕES =======================
// Cada questão: s (assunto), q (enunciado), opts (4 opções), a (correta),
// tr (tradução/explicação em PT), tip (regra/dica em PT). Nível 4º ano (A1/A2).
const QUESTIONS = [{"s":"inst","t":"futebol","q":"At the World Cup, the marching band will ___ before the match.","opts":["perform","drink","sleep","run"],"a":"perform","tr":"Antes da partida, a banda vai 'perform' (tocar/apresentar) para a torcida.","tip":"<b>perform</b> = tocar/apresentar musica para uma plateia."},{"s":"emo","t":"futebol","q":"What is the opposite of <b>happy</b> when your team loses?","opts":["sad","fast","loud","high"],"a":"sad","tr":"O oposto de 'happy' (feliz) e 'sad' (triste).","tip":"Antonimo: <b>happy</b> x <b>sad</b>."},{"s":"pastc","t":"futebol","q":"Messi ___ scoring goals when the match started.","opts":["was","were","is","are"],"a":"was","tr":"Com 'he' (Messi) usamos 'was' no past continuous.","tip":"I/he/she/it -> <b>was</b> + verbo-ing."},{"s":"sugg","t":"futebol","q":"Which sentence is a suggestion to watch the World Cup final?","opts":["Let's watch the final!","He watched the final.","Did you watch the final?","The final was long."],"a":"Let's watch the final!","tr":"'Let's + verbo' faz uma sugestao (vamos...).","tip":"<b>Let's</b> + verbo = sugestao."},{"s":"time","t":"futebol","q":"The big match starts at <b>midday</b>. What time is that?","opts":["12:00 in the day","12:00 at night","6:00 in the morning","9:00 at night"],"a":"12:00 in the day","tr":"'midday' significa meio-dia (12:00 do dia).","tip":"<b>midday</b> = meio-dia (12:00)."},{"s":"cal","t":"futebol","q":"Brazil practices football every day. They practice ___.","opts":["daily","yearly","weekly","monthly"],"a":"daily","tr":"day -> daily (diariamente, todo dia).","tip":"day + ly = <b>daily</b>."},{"s":"inst","t":"futebol","q":"Which instrument do you hit with sticks to cheer for Brazil?","opts":["drum","violin","piano","flute"],"a":"drum","tr":"O 'drum' (tambor) e batido com baquetas (sticks).","tip":"<b>drum</b> = tambor; voce bate (hit) com baquetas ou maos."},{"s":"emo","t":"futebol","q":"What is the opposite of <b>fast</b>? Pele could run very fast, not ___.","opts":["slow","soft","sad","low"],"a":"slow","tr":"O oposto de 'fast' (rapido) e 'slow' (lento).","tip":"Antonimo: <b>fast</b> x <b>slow</b>."},{"s":"pastc","t":"futebol","q":"The players ___ running on the field at six o'clock.","opts":["were","was","is","am"],"a":"were","tr":"Com 'they' (the players) usamos 'were' no past continuous.","tip":"you/we/they -> <b>were</b> + verbo-ing."},{"s":"sugg","t":"futebol","q":"___ watch the Brazil match together?","opts":["Why don't we","What did","When was","How is"],"a":"Why don't we","tr":"'Why don't we + verbo?' e uma forma de sugerir algo.","tip":"<b>Why don't we</b> + verbo? = sugestao."},{"s":"time","t":"futebol","q":"The late match ends at <b>midnight</b>. What time is that?","opts":["12:00 at night","12:00 in the day","3:00 in the day","8:00 in the morning"],"a":"12:00 at night","tr":"'midnight' significa meia-noite (12:00 da noite).","tip":"<b>midnight</b> = meia-noite (00:00)."},{"s":"cal","t":"futebol","q":"The team plays one match every week. They play ___.","opts":["weekly","daily","yearly","monthly"],"a":"weekly","tr":"week -> weekly (semanalmente, toda semana).","tip":"week + ly = <b>weekly</b>."},{"s":"inst","t":"futebol","q":"Messi's fan club has a music ___ that plays at every game.","opts":["band","goal","ball","field"],"a":"band","tr":"Um 'band' e um grupo de musicos que tocam juntos.","tip":"<b>band</b> = banda (grupo de musicos)."},{"s":"emo","t":"futebol","q":"The goal music was very ___, so everyone in the stadium could hear it. (opposite of soft)","opts":["loud","slow","calm","sad"],"a":"loud","tr":"O oposto de 'soft' (baixo/suave no som) e 'loud' (alto).","tip":"Antonimo: <b>loud</b> x <b>soft</b>."},{"s":"pastc","t":"futebol","q":"Choose the correct sentence about Neymar before the goal.","opts":["He was running fast.","He were running fast.","He was ran fast.","He were ran fast."],"a":"He was running fast.","tr":"Past continuous: was + verbo-ing (was running).","tip":"he + <b>was</b> + verb-<b>ing</b>."},{"s":"sugg","t":"futebol","q":"Complete the suggestion: ___ wants to play football after school?","opts":["Who","What","When","Where"],"a":"Who","tr":"'Who wants to + verbo?' e uma forma de sugerir/convidar.","tip":"<b>Who wants to</b> + verbo? = sugestao."},{"s":"time","t":"futebol","q":"The match kicks off at 3:30. We can say it starts at ___.","opts":["half past three","quarter past three","three o'clock","midnight"],"a":"half past three","tr":"3:30 = half past three (meia hora depois das tres).","tip":"X:30 = <b>half past</b> X."},{"s":"cal","t":"futebol","q":"The World Cup happens every four ___.","opts":["years","minutes","hours","seconds"],"a":"years","tr":"'year' significa ano; a Copa acontece a cada quatro anos.","tip":"<b>year</b> = ano."},{"s":"inst","t":"futebol","q":"Which instrument do you blow into? It is made of metal and is loud at the stadium.","opts":["trumpet","drum","guitar","violin"],"a":"trumpet","tr":"O 'trumpet' (trompete) e de metal e voce sopra (blow) nele.","tip":"<b>trumpet</b> = trompete; soprado, feito de metal."},{"s":"emo","t":"futebol","q":"A scary movie about a final match has ___ music.","opts":["scary","happy","calm","slow"],"a":"scary","tr":"Uma cena assustadora (scary) tem musica assustadora.","tip":"Cena <b>scary</b> = musica scary (assustadora/tensa)."},{"s":"pastc","t":"futebol","q":"Brazil ___ winning, but then France scored a goal. (negative)","opts":["wasn't","weren't","isn't","don't"],"a":"wasn't","tr":"Negativa com 'Brazil' (it): wasn't + verbo-ing.","tip":"Negativa: he/she/it -> <b>wasn't</b> + verbo-ing."},{"s":"sugg","t":"futebol","q":"Your friend says 'Let's cheer for Messi!' A good answer is:","opts":["Good idea!","I am tall.","It is blue.","He ran fast."],"a":"Good idea!","tr":"'Good idea!' e uma boa resposta para aceitar uma sugestao.","tip":"Aceitar sugestao: <b>Good idea!</b> ou Sure!"},{"s":"time","t":"futebol","q":"Put together the words sun + dial to name an old clock: a ___.","opts":["sundial","sun clock","dialsun","clocksun"],"a":"sundial","tr":"sun + dial = sundial (relogio de sol).","tip":"Compound noun: sun + dial = <b>sundial</b>."},{"s":"cal","t":"futebol","q":"We sing the anthem ___ the match begins, not after.","opts":["before","after","during","ago"],"a":"before","tr":"'before' significa antes (acontece primeiro).","tip":"<b>before</b> = antes; <b>after</b> = depois."},{"s":"inst","t":"futebol","q":"Neymar plays the ___ with six strings and his fingers.","opts":["guitar","trumpet","drum","piano"],"a":"guitar","tr":"A 'guitar' (violao) tem cordas (strings) que voce toca com os dedos.","tip":"<b>guitar</b> = violao/guitarra; tocado com as cordas."},{"s":"emo","t":"futebol","q":"What is the opposite of <b>high</b> sound when the player sings low?","opts":["low","fast","happy","loud"],"a":"low","tr":"O oposto de 'high' (agudo/alto) e 'low' (grave/baixo).","tip":"Antonimo de som: <b>high</b> x <b>low</b>."},{"s":"pastc","t":"futebol","q":"The fans ___ singing during the boring first half. (negative)","opts":["weren't","wasn't","isn't","aren't"],"a":"weren't","tr":"Negativa com 'they' (the fans): weren't + verbo-ing.","tip":"Negativa: you/we/they -> <b>weren't</b> + verbo-ing."},{"s":"sugg","t":"futebol","q":"Which one is a suggestion to buy tickets for the match?","opts":["Let's buy tickets.","She bought tickets.","Were the tickets cheap?","The tickets are gone."],"a":"Let's buy tickets.","tr":"'Let's buy' sugere fazer algo juntos.","tip":"<b>Let's</b> + verbo = sugestao."},{"s":"time","t":"futebol","q":"Put together hour + glass to name a sand clock: an ___.","opts":["hourglass","glasshour","hour clock","sand hour"],"a":"hourglass","tr":"hour + glass = hourglass (ampulheta).","tip":"Compound noun: hour + glass = <b>hourglass</b>."},{"s":"cal","t":"futebol","q":"The fans cheer loudly ___ the match, while the players run.","opts":["during","before","after","ago"],"a":"during","tr":"'during' significa durante (enquanto acontece).","tip":"<b>during</b> = durante."},{"s":"inst","t":"futebol","q":"A nice <b>tune</b> played after the goal is a kind of ___.","opts":["melody","ball","card","net"],"a":"melody","tr":"'tune' significa melodia (uma sequencia de notas agradavel).","tip":"<b>tune</b> = melodia."},{"s":"emo","t":"futebol","q":"Before the penalty, a ___ scene needs calm and soft music.","opts":["calm","loud","fast","scary"],"a":"calm","tr":"Uma cena 'calm' (calma) combina com musica suave e tranquila.","tip":"Cena <b>calm</b> = musica soft (suave)."},{"s":"pastc","t":"futebol","q":"___ Mbappe playing when the referee blew the whistle?","opts":["Was","Were","Did","Do"],"a":"Was","tr":"Pergunta com 'he' (Mbappe): Was + sujeito + verbo-ing?","tip":"Pergunta: <b>Was</b> + he/she/it + verbo-ing?"},{"s":"sugg","t":"futebol","q":"Choose the correct suggestion: ___ go to the stadium early?","opts":["Why don't we","Why we don't","We why don't","Don't why we"],"a":"Why don't we","tr":"A ordem correta e 'Why don't we + verbo?'.","tip":"Ordem: <b>Why don't we</b> + verbo?"},{"s":"time","t":"futebol","q":"Pele scored that famous goal many years ___.","opts":["ago","early","late","soon"],"a":"ago","tr":"'ago' indica tempo no passado (anos atras).","tip":"<b>ago</b> = atras (no passado)."},{"s":"cal","t":"futebol","q":"The World Cup in Brazil was hot because it was in ___.","opts":["summer","winter","fall","spring"],"a":"summer","tr":"'summer' e a estacao do verao (quente).","tip":"<b>summer</b> = verao (quente)."},{"s":"inst","t":"futebol","q":"The fans went to a big ___ to hear music before the final match.","opts":["concert","penalty","referee","goal"],"a":"concert","tr":"Um 'concert' (concerto/show) e quando musicos tocam para uma plateia.","tip":"<b>concert</b> = show de musica."},{"s":"emo","t":"futebol","q":"What is the opposite of <b>relaxed</b> when Brazil scores the winning goal?","opts":["excited","soft","slow","low"],"a":"excited","tr":"O oposto de 'relaxed' (relaxado) e 'excited' (animado/empolgado).","tip":"Antonimo: <b>relaxed</b> x <b>excited</b>."},{"s":"pastc","t":"futebol","q":"Pele was scoring a goal ___ the referee was watching.","opts":["while","ago","before","after"],"a":"while","tr":"Usamos 'while' para duas acoes continuas ao mesmo tempo.","tip":"<b>while</b> liga duas acoes no past continuous."},{"s":"sugg","t":"futebol","q":"Your friend suggests 'Let's play football!' Another way to say yes is:","opts":["Sure!","No idea where.","It was raining.","She is sad."],"a":"Sure!","tr":"'Sure!' significa 'claro!', uma resposta positiva a uma sugestao.","tip":"Aceitar: <b>Sure!</b> ou Good idea!"},{"s":"time","t":"futebol","q":"The fan came one hour before the match, so he was ___.","opts":["early","late","ago","loud"],"a":"early","tr":"'early' significa cedo (chegou antes da hora).","tip":"<b>early</b> = cedo; <b>late</b> = tarde."},{"s":"cal","t":"futebol","q":"The cold World Cup match was played in ___, when it snows.","opts":["winter","summer","spring","fall"],"a":"winter","tr":"'winter' e a estacao do inverno (frio).","tip":"<b>winter</b> = inverno (frio)."},{"s":"inst","t":"futebol","q":"A person who plays an instrument for the team is a ___.","opts":["musician","goalkeeper","referee","coach"],"a":"musician","tr":"Um 'musician' e um musico, alguem que toca um instrumento.","tip":"<b>musician</b> = musico."},{"s":"emo","t":"futebol","q":"The film about Mbappe has a great ___, the music that plays during the film.","opts":["soundtrack","goal","net","card"],"a":"soundtrack","tr":"'soundtrack' e a trilha sonora (a musica do filme).","tip":"<b>soundtrack</b> = trilha sonora."},{"s":"pastc","t":"futebol","q":"I was watching the match ___ Argentina scored the goal.","opts":["when","while","after","before"],"a":"when","tr":"Usamos 'when' quando uma acao continua e interrompida por uma acao no past simple.","tip":"Past continuous + <b>when</b> + past simple."},{"s":"sugg","t":"futebol","q":"Which sentence is NOT a suggestion?","opts":["Argentina won the World Cup.","Let's watch the goals.","Why don't we play?","Who wants to cheer?"],"a":"Argentina won the World Cup.","tr":"'Argentina won the World Cup' e uma afirmacao, nao uma sugestao.","tip":"Sugestao usa Let's / Why don't we / Who wants to."},{"s":"time","t":"futebol","q":"The match has 90 minutes. One sixty-minute part of time is an ___.","opts":["hour","minute","second","week"],"a":"hour","tr":"'hour' significa hora (60 minutos).","tip":"<b>hour</b> = hora (60 minutos)."},{"s":"cal","t":"futebol","q":"The team checks its game schedule once a month. They check it ___.","opts":["monthly","daily","weekly","hourly"],"a":"monthly","tr":"month -> monthly (mensalmente, todo mes).","tip":"month + ly = <b>monthly</b>."},{"s":"inst","t":"futebol","q":"Which instrument has black and white keys and is played at the World Cup show?","opts":["piano","drum","trumpet","violin"],"a":"piano","tr":"O 'piano' tem teclas (keys) pretas e brancas.","tip":"<b>piano</b> = piano; tocado com as teclas (keys)."},{"s":"emo","t":"futebol","q":"An ___ scene with a last-minute goal needs fast and loud music.","opts":["exciting","calm","slow","soft"],"a":"exciting","tr":"Uma cena 'exciting' (empolgante) combina com musica rapida e alta.","tip":"Cena <b>exciting</b> = musica fast/loud."},{"s":"pastc","t":"futebol","q":"While the fans were singing, the players ___ on the field.","opts":["were training","is training","trains","train"],"a":"were training","tr":"Past continuous: were + verbo-ING para 'they' (the players).","tip":"they/we/you → <b>were</b> + verbo-ing."},{"s":"sugg","t":"futebol","q":"Which sentence is a <b>suggestion</b> to go to the stadium?","opts":["Let's go to the stadium!","We went to the stadium.","Is the stadium big?","The stadium is far."],"a":"Let's go to the stadium!","tr":"Sugestão usa 'Let's + verbo'.","tip":"<b>Let's + verbo</b> = vamos fazer (sugestão)."},{"s":"time","t":"futebol","q":"The big match starts at <b>midday</b>. Midday means ___.","opts":["12:00 (noon)","00:00 (midnight)","6:00 in the morning","3:00 in the afternoon"],"a":"12:00 (noon)","tr":"Midday = meio-dia (12:00).","tip":"<b>Midday</b> = meio-dia (12:00)."},{"s":"cal","t":"futebol","q":"The team trains every day. They train ___.","opts":["daily","weekly","monthly","yearly"],"a":"daily","tr":"Day → daily (diariamente).","tip":"day → <b>daily</b> (todo dia)."},{"s":"inst","t":"futebol","q":"Before the final match, a big <b>band</b> played at the stadium. Which instrument do you hit with sticks?","opts":["The drum","The violin","The piano","The trumpet"],"a":"The drum","tr":"Drum = tambor; toca-se batendo com baquetas (sticks) ou mãos.","tip":"<b>Drum</b> = bater com baquetas ou mãos."},{"s":"emo","t":"futebol","q":"When the team won the <b>trophy</b>, the fans were very ___.","opts":["happy","sad","slow","soft"],"a":"happy","tr":"Happy = feliz. Time campeão deixa a torcida feliz.","tip":"<b>Happy</b> = feliz (oposto de sad)."},{"s":"pastc","t":"futebol","q":"At 8 o'clock last night, she ___ the match on TV.","opts":["was watching","were watching","is watching","watch"],"a":"was watching","tr":"Past continuous: she + was + watching.","tip":"I/he/she/it → <b>was</b> + verbo-ing."},{"s":"sugg","t":"futebol","q":"Complete the suggestion: ___ we watch the final together?","opts":["Why don't","What is","Are","Did"],"a":"Why don't","tr":"'Why don't we + verbo?' é uma forma de sugerir.","tip":"<b>Why don't we + verbo?</b> = por que não...?"},{"s":"time","t":"futebol","q":"The fans celebrated until <b>midnight</b>. Midnight means ___.","opts":["00:00","12:00 noon","9:00 morning","5:00 afternoon"],"a":"00:00","tr":"Midnight = meia-noite (00:00).","tip":"<b>Midnight</b> = meia-noite (00:00)."},{"s":"cal","t":"futebol","q":"The fans meet once a week. They meet ___.","opts":["weekly","daily","yearly","monthly"],"a":"weekly","tr":"Week → weekly (semanalmente).","tip":"week → <b>weekly</b> (toda semana)."},{"s":"inst","t":"futebol","q":"A musician blew into a shiny metal instrument when the team scored. It was a ___.","opts":["trumpet","violin","guitar","piano"],"a":"trumpet","tr":"Trumpet = trompete; instrumento de metal, toca-se soprando.","tip":"<b>Trumpet</b> = soprar, feito de metal."},{"s":"emo","t":"futebol","q":"What is the opposite of <b>loud</b>? The stadium music was not loud, it was ___.","opts":["soft","fast","scary","high"],"a":"soft","tr":"Loud (alto) ↔ soft (baixo/suave).","tip":"Oposto de <b>loud</b> = soft."},{"s":"pastc","t":"futebol","q":"Choose the correct sentence about the trophy ceremony.","opts":["The players were lifting the cup.","The players was lifting the cup.","The players were lift the cup.","The players is lifting the cup."],"a":"The players were lifting the cup.","tr":"Players (plural) usa 'were' + lifting (verbo-ing).","tip":"Plural → <b>were</b> + verbo-ing."},{"s":"sugg","t":"futebol","q":"Anna says: 'Let's buy tickets!' What is a good answer?","opts":["Good idea!","It is raining.","Where are you from?","The ball is red."],"a":"Good idea!","tr":"Resposta positiva a uma sugestão: 'Good idea!'.","tip":"Aceitar sugestão → <b>Good idea! / Sure!</b>"},{"s":"time","t":"futebol","q":"The game kicks off at 3:30. We say ___.","opts":["half past three","quarter past three","three o'clock","half past four"],"a":"half past three","tr":"3:30 = half past three (e meia).","tip":"X:30 = <b>half past X</b>."},{"s":"cal","t":"futebol","q":"The players sing the anthem ___ the match begins, not after.","opts":["before","after","during","behind"],"a":"before","tr":"Before = antes. O hino vem antes do jogo começar.","tip":"<b>Before</b> = antes."},{"s":"inst","t":"futebol","q":"Which instrument has strings and is played with a bow during the World Cup show?","opts":["The violin","The drum","The trumpet","The piano"],"a":"The violin","tr":"Violin = violino; tem cordas e usa um arco (bow).","tip":"<b>Violin</b> = cordas + arco (bow)."},{"s":"emo","t":"futebol","q":"What is the opposite of <b>fast</b>? The replay of the goal was ___.","opts":["slow","loud","happy","high"],"a":"slow","tr":"Fast (rápido) ↔ slow (lento).","tip":"Oposto de <b>fast</b> = slow."},{"s":"pastc","t":"futebol","q":"We ___ for the team when the goal was scored. (negativa)","opts":["weren't cheering","wasn't cheering","weren't cheer","isn't cheering"],"a":"weren't cheering","tr":"Negativa de 'we' no past continuous: weren't + cheering.","tip":"Negativa we → <b>weren't</b> + verbo-ing."},{"s":"sugg","t":"futebol","q":"Complete the suggestion to cheer for the team: '___ wants to make a flag?'","opts":["Who","When","Why","Where"],"a":"Who","tr":"'Who wants to + verbo?' é uma sugestão/convite.","tip":"<b>Who wants to + verbo?</b> = quem quer...?"},{"s":"time","t":"futebol","q":"Put <b>sun</b> + <b>dial</b> together to make a clock word: ___.","opts":["sundial","hourglass","cellphone","waterclock"],"a":"sundial","tr":"Sun + dial = sundial (relógio de sol).","tip":"sun + dial = <b>sundial</b>."},{"s":"cal","t":"futebol","q":"The fans cheer ___ the whole match, from start to end.","opts":["during","before","after","ago"],"a":"during","tr":"During = durante. A torcida grita durante todo o jogo.","tip":"<b>During</b> = durante (o tempo inteiro)."},{"s":"inst","t":"futebol","q":"The fan played the <b>piano</b> at the party. You play a piano by pressing its ___.","opts":["keys","strings","sticks","bow"],"a":"keys","tr":"Piano = piano; toca-se apertando as teclas (keys).","tip":"<b>Piano</b> = apertar as teclas (keys)."},{"s":"emo","t":"futebol","q":"A <b>scary</b> scene in a football movie usually has ___ music.","opts":["scary","happy","calm","soft"],"a":"scary","tr":"Cena assustadora (scary scene) tem música assustadora (scary).","tip":"<b>Scary scene</b> = música scary (assustadora)."},{"s":"pastc","t":"futebol","q":"___ you watching the World Cup final yesterday?","opts":["Were","Was","Are","Did"],"a":"Were","tr":"Pergunta no past continuous com 'you' → Were you ...?","tip":"Pergunta you → <b>Were</b> + sujeito + verbo-ing?"},{"s":"sugg","t":"futebol","q":"Which one is NOT a suggestion?","opts":["The match starts at five.","Let's paint our faces!","Why don't we sing the anthem?","Who wants to wave the flag?"],"a":"The match starts at five.","tr":"'The match starts at five' é uma afirmação, não uma sugestão.","tip":"Sugestão usa Let's / Why don't we / Who wants to."},{"s":"time","t":"futebol","q":"Put <b>hour</b> + <b>glass</b> together to make a clock word: ___.","opts":["hourglass","sundial","cellphone","alarm clock"],"a":"hourglass","tr":"Hour + glass = hourglass (ampulheta).","tip":"hour + glass = <b>hourglass</b>."},{"s":"cal","t":"futebol","q":"Football fans celebrate the win ___ the final whistle.","opts":["after","before","during","ago"],"a":"after","tr":"After = depois. A festa é depois do apito final.","tip":"<b>After</b> = depois."},{"s":"inst","t":"futebol","q":"The singer will ___ on the big <b>stage</b> before the match starts.","opts":["perform","drum","tune","rhythm"],"a":"perform","tr":"Perform = apresentar-se/tocar para a plateia.","tip":"<b>Perform</b> = apresentar-se para o público."},{"s":"emo","t":"futebol","q":"The <b>soundtrack</b> of the World Cup film was exciting. A soundtrack is the ___ of a film.","opts":["music","ticket","player","ball"],"a":"music","tr":"Soundtrack = trilha sonora; a música de um filme.","tip":"<b>Soundtrack</b> = trilha sonora (a música do filme)."},{"s":"pastc","t":"futebol","q":"The fans were celebrating ___ the rain started.","opts":["when","while","was","were"],"a":"when","tr":"Uma ação contínua interrompida por uma ação curta (started) usa 'when'.","tip":"Ação contínua + ação curta que corta → <b>when</b>."},{"s":"sugg","t":"futebol","q":"Choose the best suggestion to support the team at home.","opts":["Let's watch the game on TV!","The TV is black.","Did you see the mascot?","The trophy is gold."],"a":"Let's watch the game on TV!","tr":"Sugestão clara com 'Let's + verbo'.","tip":"Sugestão = <b>Let's + verbo</b>."},{"s":"time","t":"futebol","q":"Put <b>cell</b> + <b>phone</b> together to make this word: ___.","opts":["cellphone","sundial","hourglass","waterclock"],"a":"cellphone","tr":"Cell + phone = cellphone (celular).","tip":"cell + phone = <b>cellphone</b>."},{"s":"cal","t":"futebol","q":"In Brazil, the World Cup is sometimes played in the warm ___ called summer.","opts":["season","century","calendar","minute"],"a":"season","tr":"Season = estação do ano (summer, winter, spring, fall).","tip":"<b>Season</b> = estação (verão, inverno...)."},{"s":"inst","t":"futebol","q":"A nice melody is also called a ___. The team's song had a happy one.","opts":["tune","stage","band","concert"],"a":"tune","tr":"Tune = melodia (a parte musical da canção).","tip":"<b>Tune</b> = melodia."},{"s":"emo","t":"futebol","q":"What is the opposite of <b>high</b>? The horn made a very ___ sound.","opts":["low","fast","sad","loud"],"a":"low","tr":"High (agudo/alto) ↔ low (grave/baixo).","tip":"Oposto de <b>high</b> = low."},{"s":"pastc","t":"futebol","q":"___ the players were resting, the coach was talking. (duas ações ao mesmo tempo)","opts":["While","When","Was","Did"],"a":"While","tr":"Duas ações longas acontecendo juntas usam 'while'.","tip":"Duas ações contínuas juntas → <b>while</b>."},{"s":"sugg","t":"futebol","q":"Tom suggests: 'Why don't we make a banner?' Maria answers: '___'","opts":["Sure!","It is Monday.","The ball is heavy.","Was he running?"],"a":"Sure!","tr":"'Sure!' aceita a sugestão.","tip":"Aceitar → <b>Sure! / Good idea!</b>"},{"s":"time","t":"futebol","q":"We arrived ___ for the match and waited two hours before kick-off.","opts":["early","late","ago","soft"],"a":"early","tr":"Early = cedo. Chegar cedo é esperar antes da hora.","tip":"<b>Early</b> = cedo (oposto de late)."},{"s":"cal","t":"futebol","q":"The trophy is shown once a year. It is shown ___.","opts":["yearly","daily","weekly","monthly"],"a":"yearly","tr":"Year → yearly (anualmente).","tip":"year → <b>yearly</b> (todo ano)."},{"s":"inst","t":"futebol","q":"Many fans went to a big music <b>concert</b> near the stadium. A person who plays music is a ___.","opts":["musician","player","winner","fan"],"a":"musician","tr":"Musician = músico; pessoa que toca instrumentos.","tip":"<b>Musician</b> = quem toca música."},{"s":"emo","t":"futebol","q":"Before the calm moment of silence, the music was very ___.","opts":["calm","loud","fast","scary"],"a":"calm","tr":"Momento de silêncio calmo combina com música calma (calm).","tip":"<b>Calm</b> = calmo, tranquilo."},{"s":"pastc","t":"futebol","q":"The goalkeeper ___ catching the ball at that moment.","opts":["was","were","is","did"],"a":"was","tr":"The goalkeeper (he/it) usa 'was' no past continuous.","tip":"he/she/it → <b>was</b> + verbo-ing."},{"s":"sugg","t":"futebol","q":"Complete: '___ go and meet the team mascot!'","opts":["Let's","Did","Was","Are"],"a":"Let's","tr":"'Let's + verbo' faz uma sugestão.","tip":"<b>Let's + verbo</b> para sugerir."},{"s":"time","t":"futebol","q":"The team won the cup three years ___.","opts":["ago","early","late","soon"],"a":"ago","tr":"Ago = atrás (tempo no passado): three years ago = três anos atrás.","tip":"<b>Ago</b> = atrás (tempo passado)."},{"s":"inst","t":"futebol","q":"Which instrument has six strings and the fan plays it with the fingers?","opts":["The guitar","The drum","The trumpet","The piano"],"a":"The guitar","tr":"Guitar = violão/guitarra; tem cordas tocadas com os dedos.","tip":"<b>Guitar</b> = cordas tocadas com os dedos."},{"s":"emo","t":"futebol","q":"What is the opposite of <b>relaxed</b>? Before the penalty, the fans were ___.","opts":["excited","soft","slow","low"],"a":"excited","tr":"Relaxed (relaxado) ↔ excited (animado/agitado).","tip":"Oposto de <b>relaxed</b> = excited."},{"s":"pastc","t":"futebol","q":"He ___ wearing the team shirt; he was wearing a blue one. (negativa)","opts":["wasn't","weren't","isn't","didn't"],"a":"wasn't","tr":"Negativa com 'he' → wasn't + wearing.","tip":"Negativa he/she/it → <b>wasn't</b> + verbo-ing."},{"s":"sugg","t":"futebol","q":"The match is on TV tonight! ___ watch it together at my house?","opts":["Why don't we","We are not","Do you watched","We watching"],"a":"Why don't we","tr":"O jogo passa na TV hoje a noite! Por que nao assistimos juntos na minha casa?","tip":"'Why don't we...?' e uma forma de fazer sugestao, igual a 'Let's...'. Depois vem o verbo na forma base (watch)."},{"s":"time","t":"futebol","q":"My alarm clock rang very early because the game was at 7 ___. I jumped out of bed!","opts":["o'clock","minute ago","hourglass","midnight band"],"a":"o'clock","tr":"Meu despertador tocou bem cedo porque o jogo era as 7 horas em ponto. Eu pulei da cama!","tip":"Usamos 'o'clock' para horas exatas (7 o'clock = 7 em ponto). 'alarm clock' = despertador; 'early' = cedo."},{"s":"inst","t":"espaco","q":"The astronaut plays the <b>drum</b> on the space station. How do you play a drum?","opts":["You hit it with sticks or hands","You blow into it","You press the keys","You move a bow on the strings"],"a":"You hit it with sticks or hands","tr":"O tambor (drum) e tocado batendo com baquetas ou com as maos.","tip":"<b>drum</b> = bater (hit). trumpet = soprar; violin = arco; piano = teclas."},{"s":"inst","t":"espaco","q":"On Mars, the crew plays the <b>trumpet</b>. How do you play a trumpet?","opts":["You blow into it","You hit it with sticks","You press the keys","You move a bow"],"a":"You blow into it","tr":"O trompete (trumpet) e tocado soprando; e feito de metal.","tip":"trumpet = soprar (blow), e de metal."},{"s":"inst","t":"espaco","q":"Which instrument do you play with a <b>bow</b> and strings near the telescope?","opts":["The violin","The drum","The trumpet","The piano"],"a":"The violin","tr":"O violino (violin) e tocado com um arco (bow) nas cordas.","tip":"violin = arco + cordas (strings)."},{"s":"inst","t":"espaco","q":"The robot on the rocket plays the <b>piano</b>. How do you play a piano?","opts":["You press the keys","You blow into it","You hit it with sticks","You move a bow"],"a":"You press the keys","tr":"O piano e tocado pressionando as teclas (keys).","tip":"piano = teclas (keys)."},{"s":"inst","t":"espaco","q":"The star captain plays the <b>guitar</b>. A guitar has...","opts":["strings","keys","metal tubes","drum sticks"],"a":"strings","tr":"O violao (guitar) tem cordas (strings).","tip":"guitar = cordas (strings)."},{"s":"inst","t":"espaco","q":"A group of musicians who play together on the Moon is called a ___.","opts":["band","concert","rhythm","tune"],"a":"band","tr":"Banda (band) e um grupo de musicos tocando juntos.","tip":"band = banda (grupo); concert = o show."},{"s":"inst","t":"espaco","q":"The astronauts <b>perform</b> on the space station <b>stage</b>. What does 'perform' mean?","opts":["to play music for an audience","to eat dinner","to fly a rocket","to sleep"],"a":"to play music for an audience","tr":"Perform = tocar/apresentar para uma plateia (audience).","tip":"perform = apresentar-se para o publico."},{"s":"inst","t":"espaco","q":"We listen to a happy <b>tune</b> from space. A 'tune' is a ___.","opts":["melody","telescope","planet","drum"],"a":"melody","tr":"Tune = melodia (melody), a sequencia de notas que cantamos.","tip":"tune = melodia."},{"s":"inst","t":"espaco","q":"A person who plays an instrument in the galaxy band is a ___.","opts":["musician","astronaut","telescope","planet"],"a":"musician","tr":"Musician = musico, pessoa que toca um instrumento.","tip":"musician = musico."},{"s":"inst","t":"espaco","q":"Tonight the crew will <b>sing</b> and one will play guitar. Choose the verb: She likes ___ in the rocket.","opts":["singing","drum","stage","band"],"a":"singing","tr":"Singing = cantar (a acao de cantar).","tip":"singing = canto; usa-se o verbo com -ing depois de 'likes'."},{"s":"emo","t":"espaco","q":"Opposite of <b>fast</b>: The rocket is not slow, it is very ___.","opts":["fast","slow","soft","sad"],"a":"fast","tr":"O oposto de slow (devagar) e fast (rapido).","tip":"fast <-> slow (rapido x devagar)."},{"s":"emo","t":"espaco","q":"Opposite of <b>happy</b>: When the mission failed, the astronaut was ___.","opts":["sad","happy","loud","high"],"a":"sad","tr":"O oposto de happy (feliz) e sad (triste).","tip":"happy <-> sad (feliz x triste)."},{"s":"emo","t":"espaco","q":"Opposite of <b>loud</b>: In deep space the sound is not loud, it is ___.","opts":["soft","loud","fast","excited"],"a":"soft","tr":"O oposto de loud (alto/barulhento) e soft (baixinho/suave).","tip":"loud <-> soft (alto x suave)."},{"s":"emo","t":"espaco","q":"Opposite of <b>high</b>: The note from the planet is not high, it is ___.","opts":["low","high","happy","fast"],"a":"low","tr":"O oposto de high (agudo/alto) e low (grave/baixo).","tip":"high <-> low (agudo x grave)."},{"s":"emo","t":"espaco","q":"Opposite of <b>relaxed</b>: Before the launch, the crew was not relaxed, they were ___.","opts":["excited","relaxed","soft","slow"],"a":"excited","tr":"O oposto de relaxed (relaxado) e excited (agitado/empolgado).","tip":"relaxed <-> excited (relaxado x agitado)."},{"s":"emo","t":"espaco","q":"A <b>scary</b> scene in the space movie has ___ music.","opts":["scary","happy","calm","soft"],"a":"scary","tr":"Uma cena assustadora (scary) tem musica assustadora.","tip":"scary = assustador; combina com a cena de medo."},{"s":"emo","t":"espaco","q":"A <b>calm</b> scene of the quiet Moon has ___ music.","opts":["soft","loud","scary","fast"],"a":"soft","tr":"Uma cena calma (calm) tem musica suave (soft).","tip":"calm scene = musica soft/calma."},{"s":"emo","t":"espaco","q":"The music of the space film is the ___.","opts":["soundtrack","telescope","rocket","galaxy"],"a":"soundtrack","tr":"Soundtrack = trilha sonora, a musica de um filme.","tip":"soundtrack = trilha sonora."},{"s":"emo","t":"espaco","q":"When the rocket finally lands safely, the astronaut feels ___.","opts":["happy","sad","scary","low"],"a":"happy","tr":"Ao pousar em seguranca, o astronauta se sente feliz (happy).","tip":"Final feliz = happy."},{"s":"emo","t":"espaco","q":"An <b>exciting</b> space chase scene usually has ___ music.","opts":["fast","slow","soft","sad"],"a":"fast","tr":"Uma cena empolgante (exciting) costuma ter musica rapida (fast).","tip":"exciting = rapido/agitado; calmo = slow/soft."},{"s":"pastc","t":"espaco","q":"Choose the correct form: At 8 o'clock, the astronaut ___ looking at the stars.","opts":["was","were","is","are"],"a":"was","tr":"Past continuous: he/she/it usa <b>was</b> + verbo-ING.","tip":"I/he/she/it -> was; you/we/they -> were."},{"s":"pastc","t":"espaco","q":"Complete with was/were: The astronauts ___ floating in the space station.","opts":["were","was","is","am"],"a":"were","tr":"They (eles) usa <b>were</b> no past continuous.","tip":"you/we/they -> were."},{"s":"pastc","t":"espaco","q":"Choose the correct sentence about the rocket.","opts":["The rocket was flying to Mars.","The rocket were flying to Mars.","The rocket was fly to Mars.","The rocket flying was to Mars."],"a":"The rocket was flying to Mars.","tr":"Past continuous: was + verbo-ING (flying).","tip":"was/were + verbo terminado em -ing."},{"s":"pastc","t":"espaco","q":"Negative form: She ___ not sleeping during the launch.","opts":["was","were","is","did"],"a":"was","tr":"She nao estava dormindo: She <b>was not (wasn't)</b> sleeping.","tip":"she -> was not / wasn't."},{"s":"pastc","t":"espaco","q":"Choose while or when: I was watching the stars ___ my brother was reading a space book.","opts":["while","when","ago","after"],"a":"while","tr":"Duas acoes contINUAS ao mesmo tempo usam <b>while</b>.","tip":"while = duas acoes contInuas juntas."},{"s":"pastc","t":"espaco","q":"Choose while or when: We were watching the Moon ___ the alarm rang.","opts":["when","while","during","early"],"a":"when","tr":"Uma acao contInua interrompida por uma acao curta (past simple) usa <b>when</b>.","tip":"when = past continuous interrompido por past simple."},{"s":"pastc","t":"espaco","q":"Question form: ___ the astronauts working on the space station?","opts":["Were","Was","Did","Are"],"a":"Were","tr":"Pergunta no past continuous com 'they': <b>Were</b> + sujeito + verbo-ing?","tip":"they -> Were ... working?"},{"s":"pastc","t":"espaco","q":"Complete with was/were: ___ you looking through the telescope last night?","opts":["Were","Was","Did","Are"],"a":"Were","tr":"Com 'you' usamos <b>Were</b> na pergunta.","tip":"you -> Were you looking ...?"},{"s":"pastc","t":"espaco","q":"Choose the correct form: The stars ___ shining in the dark sky.","opts":["were","was","is","did"],"a":"were","tr":"Stars (plural) usa <b>were</b> no past continuous.","tip":"Sujeito plural -> were."},{"s":"pastc","t":"espaco","q":"Choose the correct sentence (negative).","opts":["He wasn't wearing his helmet.","He weren't wearing his helmet.","He wasn't wear his helmet.","He didn't wearing his helmet."],"a":"He wasn't wearing his helmet.","tr":"He + wasn't + verbo-ING (wearing).","tip":"he -> wasn't + verbo-ing."},{"s":"sugg","t":"espaco","q":"Which sentence is a <b>suggestion</b>?","opts":["Let's visit the space museum!","The rocket is red.","Where is Mars?","I am an astronaut."],"a":"Let's visit the space museum!","tr":"Sugestao usa 'Let's + verbo'. As outras sao afirmacao ou pergunta.","tip":"Let's = vamos (sugestao)."},{"s":"sugg","t":"espaco","q":"Complete the suggestion: ___ watch the stars tonight!","opts":["Let's","We are","Is","The"],"a":"Let's","tr":"Let's + verbo = sugestao (vamos assistir as estrelas).","tip":"Let's + verbo na forma base."},{"s":"sugg","t":"espaco","q":"Complete: Why don't we ___ a rocket model?","opts":["build","building","builds","built"],"a":"build","tr":"Apos 'Why don't we' usa-se o verbo na forma base (build).","tip":"Why don't we + verbo base?"},{"s":"sugg","t":"espaco","q":"Complete the suggestion: Who wants to ___ the telescope with me?","opts":["use","using","uses","used"],"a":"use","tr":"Apos 'Who wants to' usa-se o verbo base (use).","tip":"Who wants to + verbo base?"},{"s":"sugg","t":"espaco","q":"A good <b>reply</b> to 'Let's go to the planetarium!' is:","opts":["Good idea!","It is blue.","No, the Moon.","Yesterday."],"a":"Good idea!","tr":"Para aceitar uma sugestao respondemos 'Good idea!' ou 'Sure!'.","tip":"Aceitar sugestao = Good idea! / Sure!"},{"s":"sugg","t":"espaco","q":"Which one is a suggestion?","opts":["Why don't we draw the planets?","The planets are far.","Saturn has rings.","Is it cold on Mars?"],"a":"Why don't we draw the planets?","tr":"'Why don't we...?' e uma forma de fazer sugestao.","tip":"Why don't we...? = sugestao."},{"s":"sugg","t":"espaco","q":"Choose the best suggestion to see the stars: ___ go outside tonight.","opts":["Let's","I am","There is","It was"],"a":"Let's","tr":"Let's go = vamos sair (sugestao).","tip":"Let's + verbo = sugestao."},{"s":"sugg","t":"espaco","q":"Complete: Let's ___ a song about the Moon!","opts":["sing","sang","sings","singing"],"a":"sing","tr":"Apos 'Let's' usa-se o verbo na forma base (sing).","tip":"Let's + verbo base."},{"s":"sugg","t":"espaco","q":"Which reply <b>accepts</b> a suggestion?","opts":["Sure!","It is round.","Goodbye.","Two stars."],"a":"Sure!","tr":"'Sure!' (claro!) aceita uma sugestao.","tip":"Sure! = claro! (aceitar)."},{"s":"sugg","t":"espaco","q":"Which sentence is NOT a suggestion?","opts":["The space station is big.","Let's count the stars.","Why don't we fly to Mars?","Who wants to see Saturn?"],"a":"The space station is big.","tr":"'The space station is big' e uma afirmacao, nao uma sugestao.","tip":"Sugestao = Let's / Why don't we / Who wants to."},{"s":"time","t":"espaco","q":"What does <b>midday</b> mean?","opts":["12:00 in the day","12:00 at night","in the morning","early evening"],"a":"12:00 in the day","tr":"Midday = meio-dia (12:00 do dia).","tip":"midday = meio-dia; midnight = meia-noite."},{"s":"time","t":"espaco","q":"What does <b>midnight</b> mean?","opts":["12:00 at night","12:00 in the day","in the morning","the afternoon"],"a":"12:00 at night","tr":"Midnight = meia-noite (12:00 da noite).","tip":"midnight = meia-noite."},{"s":"time","t":"espaco","q":"Make a compound noun: sun + dial = ___ (an old clock that uses a shadow).","opts":["sundial","sunclock","dialsun","sunhour"],"a":"sundial","tr":"sun + dial = sundial (relogio de sol que usa a sombra).","tip":"Compound noun: junta duas palavras (sun+dial)."},{"s":"time","t":"espaco","q":"Make a compound noun: hour + glass = ___ (it uses sand to count time).","opts":["hourglass","glasshour","hourclock","sandhour"],"a":"hourglass","tr":"hour + glass = hourglass (ampulheta, conta o tempo com areia).","tip":"hour+glass = hourglass."},{"s":"time","t":"espaco","q":"Make a compound noun: cell + phone = ___ (the astronaut uses it to talk).","opts":["cellphone","phonecell","cellclock","cellhour"],"a":"cellphone","tr":"cell + phone = cellphone (celular).","tip":"cell+phone = cellphone."},{"s":"time","t":"espaco","q":"The rocket launched at 3:30. We say it launched at ___.","opts":["half past three","quarter past three","three o'clock","half past two"],"a":"half past three","tr":"3:30 = half past three (e meia / trinta minutos depois das tres).","tip":"X:30 = half past X."},{"s":"time","t":"espaco","q":"The clock shows 5:15. We say it is ___.","opts":["quarter past five","half past five","five o'clock","quarter past four"],"a":"quarter past five","tr":"5:15 = quarter past five (e quinze).","tip":"X:15 = quarter past X."},{"s":"time","t":"espaco","q":"An <b>alarm clock</b> woke the astronaut up. An alarm clock is a clock that ___.","opts":["makes a sound to wake you","shows the Moon","flies to space","plays music only"],"a":"makes a sound to wake you","tr":"Alarm clock = despertador, faz som para te acordar.","tip":"alarm clock = despertador."},{"s":"time","t":"espaco","q":"The rocket left two hours ___. Which word fits?","opts":["ago","early","late","minute"],"a":"ago","tr":"'ago' = atras (ha duas horas atras).","tip":"ago = atras (tempo passado)."},{"s":"time","t":"espaco","q":"The astronaut arrived before time. He was ___.","opts":["early","late","ago","midnight"],"a":"early","tr":"Early = cedo/adiantado (antes da hora).","tip":"early = cedo; late = atrasado."},{"s":"cal","t":"espaco","q":"Choose the -ly adverb: The crew checks the rocket every day, so they check it ___.","opts":["daily","day","weekly","yearly"],"a":"daily","tr":"day -> daily (diariamente).","tip":"day + ly = daily."},{"s":"cal","t":"espaco","q":"Choose the -ly adverb: It happens every week, so it happens ___.","opts":["weekly","week","daily","monthly"],"a":"weekly","tr":"week -> weekly (semanalmente).","tip":"week + ly = weekly."},{"s":"cal","t":"espaco","q":"Choose the -ly adverb: The space report comes every month, so it comes ___.","opts":["monthly","month","yearly","weekly"],"a":"monthly","tr":"month -> monthly (mensalmente).","tip":"month + ly = monthly."},{"s":"cal","t":"espaco","q":"Choose the -ly adverb: The big space festival happens every year, so it happens ___.","opts":["yearly","year","daily","monthly"],"a":"yearly","tr":"year -> yearly (anualmente).","tip":"year + ly = yearly."},{"s":"cal","t":"espaco","q":"Choose before/during/after: We put on the helmet ___ we go outside the rocket.","opts":["before","during","after","season"],"a":"before","tr":"before = antes; colocamos o capacete antes de sair.","tip":"before = antes; after = depois; during = durante."},{"s":"cal","t":"espaco","q":"Choose before/during/after: We celebrated ___ the rocket landed safely.","opts":["after","before","during","month"],"a":"after","tr":"after = depois; comemoramos depois do pouso.","tip":"after = depois."},{"s":"cal","t":"espaco","q":"Choose before/during/after: The crew stayed quiet ___ the launch.","opts":["during","before","after","year"],"a":"during","tr":"during = durante; ficaram quietos durante o lancamento.","tip":"during = durante (ao mesmo tempo)."},{"s":"cal","t":"espaco","q":"On the cold planet, it snows. This is most like the season called ___.","opts":["winter","summer","spring","fall"],"a":"winter","tr":"Winter = inverno, a estacao fria com neve.","tip":"winter = inverno (frio)."},{"s":"cal","t":"espaco","q":"The hot season when it is very warm is called ___.","opts":["summer","winter","fall","spring"],"a":"summer","tr":"Summer = verao, a estacao quente.","tip":"summer = verao (quente)."},{"s":"cal","t":"espaco","q":"One hundred years are one ___.","opts":["century","week","season","month"],"a":"century","tr":"Century = seculo, cem anos.","tip":"century = seculo (100 anos)."},{"s":"inst","t":"dino","q":"At the dinosaur museum concert, the T-Rex band played music. Which instrument do you hit with sticks?","opts":["drum","trumpet","violin","piano"],"a":"drum","tr":"O 'drum' (tambor) e tocado batendo com baquetas (sticks) ou as maos.","tip":"<b>Drum</b> = bater com baquetas."},{"s":"inst","t":"dino","q":"The Triceratops blows air into this metal instrument. What is it?","opts":["trumpet","guitar","drum","piano"],"a":"trumpet","tr":"O 'trumpet' (trompete) e de metal e voce sopra ar nele.","tip":"<b>Trumpet</b> = soprar, metal."},{"s":"inst","t":"dino","q":"The paleontologist plays this string instrument with a bow. What is it?","opts":["violin","drum","trumpet","piano"],"a":"violin","tr":"O 'violin' (violino) tem cordas e e tocado com um arco (bow).","tip":"<b>Violin</b> = arco e cordas."},{"s":"inst","t":"dino","q":"At the fossil show you press black and white keys to play this. What is it?","opts":["piano","guitar","trumpet","drum"],"a":"piano","tr":"O 'piano' e tocado pressionando as teclas (keys).","tip":"<b>Piano</b> = teclas."},{"s":"inst","t":"dino","q":"The Velociraptor plays a guitar. How do you play a guitar?","opts":["You play the strings","You blow air","You hit the keys","You use a bow"],"a":"You play the strings","tr":"A 'guitar' (violao) tem cordas (strings) que voce dedilha.","tip":"<b>Guitar</b> = cordas."},{"s":"inst","t":"dino","q":"A group of dinosaurs who play music together is called a ___.","opts":["band","stage","tune","rhythm"],"a":"band","tr":"'Band' = banda, um grupo que toca musica junto.","tip":"<b>Band</b> = banda."},{"s":"inst","t":"dino","q":"The musicians stand on the ___ to play in front of the dinosaurs.","opts":["stage","concert","tune","jazz"],"a":"stage","tr":"'Stage' = palco, onde os musicos ficam para tocar.","tip":"<b>Stage</b> = palco."},{"s":"inst","t":"dino","q":"The dino band will ___ a new song at the Jurassic concert tonight.","opts":["perform","read","sleep","dig"],"a":"perform","tr":"'Perform' = tocar/apresentar para uma plateia.","tip":"<b>Perform</b> = apresentar para o publico."},{"s":"inst","t":"dino","q":"A nice, slow melody that you can hum is called a ___.","opts":["tune","stage","band","drum"],"a":"tune","tr":"'Tune' = melodia, a parte cantavel da musica.","tip":"<b>Tune</b> = melodia."},{"s":"inst","t":"dino","q":"A person who plays an instrument is a ___.","opts":["musician","fossil","museum","stage"],"a":"musician","tr":"'Musician' = musico, quem toca um instrumento.","tip":"<b>Musician</b> = musico."},{"s":"emo","t":"dino","q":"The opposite of <b>happy</b> is ___.","opts":["sad","loud","fast","high"],"a":"sad","tr":"O antonimo de 'happy' (feliz) e 'sad' (triste).","tip":"happy &harr; sad."},{"s":"emo","t":"dino","q":"The opposite of <b>loud</b> is ___.","opts":["soft","high","fast","sad"],"a":"soft","tr":"O antonimo de 'loud' (alto) e 'soft' (baixo/suave).","tip":"loud &harr; soft."},{"s":"emo","t":"dino","q":"The opposite of <b>fast</b> is ___.","opts":["slow","high","happy","loud"],"a":"slow","tr":"O antonimo de 'fast' (rapido) e 'slow' (lento).","tip":"fast &harr; slow."},{"s":"emo","t":"dino","q":"The opposite of <b>high</b> is ___.","opts":["low","soft","slow","sad"],"a":"low","tr":"O antonimo de 'high' (agudo/alto) e 'low' (grave/baixo).","tip":"high &harr; low."},{"s":"emo","t":"dino","q":"The opposite of <b>relaxed</b> is ___.","opts":["excited","slow","soft","low"],"a":"excited","tr":"O antonimo de 'relaxed' (relaxado) e 'excited' (agitado/empolgado).","tip":"relaxed &harr; excited."},{"s":"emo","t":"dino","q":"When the T-Rex appears, the movie music is ___ and exciting.","opts":["scary","calm","soft","slow"],"a":"scary","tr":"Uma cena com o T-Rex tem musica 'scary' (assustadora).","tip":"Cena de medo = musica scary."},{"s":"emo","t":"dino","q":"A <b>calm</b> scene of baby dinosaurs sleeping has ___ music.","opts":["soft","loud","scary","fast"],"a":"soft","tr":"Uma cena calma (calm) combina com musica suave (soft).","tip":"Cena calma = musica soft."},{"s":"emo","t":"dino","q":"The music that plays during a dinosaur movie is called the ___.","opts":["soundtrack","drum","stage","band"],"a":"soundtrack","tr":"'Soundtrack' = trilha sonora do filme.","tip":"<b>Soundtrack</b> = trilha sonora."},{"s":"emo","t":"dino","q":"A part of a movie, like the dinosaur chase, is called a ___.","opts":["scene","tune","fossil","year"],"a":"scene","tr":"'Scene' = cena, uma parte do filme.","tip":"<b>Scene</b> = cena."},{"s":"emo","t":"dino","q":"Happiness and sadness are both kinds of ___.","opts":["emotion","sound","stage","season"],"a":"emotion","tr":"'Emotion' = emocao, como felicidade e tristeza.","tip":"<b>Emotion</b> = emocao."},{"s":"pastc","t":"dino","q":"Yesterday the paleontologist ___ digging for fossils all morning.","opts":["was","were","is","are"],"a":"was","tr":"Com 'he/she/it' usamos 'was' no past continuous.","tip":"he/she/it &rarr; <b>was</b> + verbo-ing."},{"s":"pastc","t":"dino","q":"The dinosaurs ___ running across the valley when the storm started.","opts":["were","was","are","is"],"a":"were","tr":"Com 'they' usamos 'were' no past continuous.","tip":"you/we/they &rarr; <b>were</b>."},{"s":"pastc","t":"dino","q":"I ___ looking at the T-Rex skeleton at 3 o'clock.","opts":["was","were","is","am"],"a":"was","tr":"Com 'I' usamos 'was' no past continuous.","tip":"I &rarr; <b>was</b>."},{"s":"pastc","t":"dino","q":"We ___ studying the fossils when the museum closed.","opts":["were","was","is","are"],"a":"were","tr":"Com 'we' usamos 'were' no past continuous.","tip":"we &rarr; <b>were</b>."},{"s":"pastc","t":"dino","q":"Which is the correct past continuous? 'The Triceratops ___ eating leaves.'","opts":["was eating","was ate","were eat","is eating"],"a":"was eating","tr":"Past continuous = was/were + verbo-ING.","tip":"was + <b>eating</b> (verbo-ing)."},{"s":"pastc","t":"dino","q":"Negative: The dinosaur ___ sleeping; it was hunting.","opts":["wasn't","weren't","isn't","didn't"],"a":"wasn't","tr":"Negativa com 'it' = wasn't (was not).","tip":"it &rarr; <b>wasn't</b>."},{"s":"pastc","t":"dino","q":"Negative: The scientists ___ working on Sunday.","opts":["weren't","wasn't","isn't","don't"],"a":"weren't","tr":"Negativa com 'they' = weren't (were not).","tip":"they &rarr; <b>weren't</b>."},{"s":"pastc","t":"dino","q":"Question: ___ the Velociraptor running fast?","opts":["Was","Were","Did","Is"],"a":"Was","tr":"Pergunta com 'it' = Was + sujeito + verbo-ing?","tip":"<b>Was</b> + it + verbo-ing?"},{"s":"pastc","t":"dino","q":"Question: ___ the paleontologists digging in the desert?","opts":["Were","Was","Did","Are"],"a":"Were","tr":"Pergunta com 'they' = Were + sujeito + verbo-ing?","tip":"<b>Were</b> + they + verbo-ing?"},{"s":"pastc","t":"dino","q":"___ the T-Rex was roaring, the small dinosaurs were hiding. (two actions at the same time)","opts":["While","When","Before","After"],"a":"While","tr":"Usamos 'while' para duas acoes continuas ao mesmo tempo.","tip":"<b>While</b> = duas acoes continuas juntas."},{"s":"sugg","t":"dino","q":"Which sentence is a suggestion?","opts":["Let's go to the dinosaur museum.","The T-Rex is very big.","Where is the fossil?","I saw a Triceratops."],"a":"Let's go to the dinosaur museum.","tr":"'Let's + verbo' faz uma sugestao.","tip":"<b>Let's</b> = vamos (sugestao)."},{"s":"sugg","t":"dino","q":"Complete the suggestion: '___ we visit the fossil dig today?'","opts":["Why don't","Let's","Who wants","Are"],"a":"Why don't","tr":"'Why don't we + verbo?' e uma forma de sugerir.","tip":"<b>Why don't we</b> + verbo?"},{"s":"sugg","t":"dino","q":"Complete: '___ to dig for dinosaur bones with me?'","opts":["Who wants","Let's","Why don't","Are we"],"a":"Who wants","tr":"'Who wants to + verbo?' convida alguem a fazer algo.","tip":"<b>Who wants to</b> + verbo?"},{"s":"sugg","t":"dino","q":"Complete the suggestion: 'Let's ___ the Jurassic exhibit!'","opts":["see","seeing","sees","saw"],"a":"see","tr":"Depois de 'Let's' usamos o verbo na forma base.","tip":"Let's + <b>verbo base</b>."},{"s":"sugg","t":"dino","q":"Your friend says 'Let's draw a T-Rex!' A good answer is:","opts":["Good idea!","No music.","It is midnight.","The fossil is old."],"a":"Good idea!","tr":"'Good idea!' e uma boa resposta para aceitar uma sugestao.","tip":"Aceitar sugestao: <b>Good idea!</b>"},{"s":"sugg","t":"dino","q":"Which is NOT a suggestion?","opts":["The Velociraptor is fast.","Let's run!","Why don't we hide?","Who wants to play?"],"a":"The Velociraptor is fast.","tr":"Essa frase e uma afirmacao, nao uma sugestao.","tip":"Afirmacao descreve; sugestao convida a agir."},{"s":"sugg","t":"dino","q":"Friend: 'Why don't we paint dinosaurs?' You agree: '___'","opts":["Sure!","I am sad.","It is winter.","The drum is loud."],"a":"Sure!","tr":"'Sure!' aceita a sugestao do amigo.","tip":"Aceitar: <b>Sure!</b>"},{"s":"sugg","t":"dino","q":"Which is the best suggestion to make a plan?","opts":["Let's build a dino model.","The fossil is heavy.","She found a bone.","It was raining."],"a":"Let's build a dino model.","tr":"'Let's + verbo' propoe um plano juntos.","tip":"<b>Let's</b> propoe um plano."},{"s":"sugg","t":"dino","q":"Complete: 'Why ___ we go to the dinosaur park?'","opts":["don't","do","not","are"],"a":"don't","tr":"A estrutura correta e 'Why don't we + verbo?'.","tip":"<b>Why don't we</b> + verbo?"},{"s":"sugg","t":"dino","q":"Which sentence suggests doing something together?","opts":["Let's look for fossils.","The museum is open.","That is a big egg.","He is a paleontologist."],"a":"Let's look for fossils.","tr":"'Let's' inclui voce e o outro na acao.","tip":"<b>Let's</b> = nos dois juntos."},{"s":"time","t":"dino","q":"The dinosaurs ate lunch at ___, which means 12:00 in the day.","opts":["midday","midnight","hour","minute"],"a":"midday","tr":"'Midday' = meio-dia (12:00).","tip":"<b>Midday</b> = meio-dia."},{"s":"time","t":"dino","q":"At ___, it is 12:00 at night and very dark in the Jurassic forest.","opts":["midnight","midday","early","late"],"a":"midnight","tr":"'Midnight' = meia-noite (12:00 da noite).","tip":"<b>Midnight</b> = meia-noite."},{"s":"time","t":"dino","q":"Sun + dial = ___, an old clock that uses a shadow.","opts":["sundial","hourglass","cellphone","calendar"],"a":"sundial","tr":"'Sundial' = relogio de sol (sun+dial).","tip":"sun+dial = <b>sundial</b>."},{"s":"time","t":"dino","q":"Hour + glass = ___, a clock with sand inside.","opts":["hourglass","sundial","cellphone","alarm clock"],"a":"hourglass","tr":"'Hourglass' = ampulheta (hour+glass).","tip":"hour+glass = <b>hourglass</b>."},{"s":"time","t":"dino","q":"Cell + phone = ___, which the paleontologist uses to check the time.","opts":["cellphone","sundial","hourglass","sundeck"],"a":"cellphone","tr":"'Cellphone' = celular (cell+phone).","tip":"cell+phone = <b>cellphone</b>."},{"s":"time","t":"dino","q":"The clock on the museum wall shows 3:30. We read it as ___.","opts":["half past three","quarter past three","three o'clock","half past four"],"a":"half past three","tr":"3:30 = 'half past three' (meia hora depois das 3).","tip":"X:30 = <b>half past</b> X."},{"s":"time","t":"dino","q":"The clock shows 5:00 exactly. We say ___.","opts":["five o'clock","half past five","quarter past five","five minutes"],"a":"five o'clock","tr":"Hora cheia (5:00) = 'five o'clock'.","tip":"X:00 = <b>X o'clock</b>."},{"s":"time","t":"dino","q":"There are sixty minutes in one ___.","opts":["hour","day","week","year"],"a":"hour","tr":"Uma 'hour' (hora) tem 60 minutos.","tip":"1 <b>hour</b> = 60 minutes."},{"s":"time","t":"dino","q":"The team woke up before the sun. They were very ___.","opts":["early","late","slow","loud"],"a":"early","tr":"'Early' = cedo, antes do horario normal.","tip":"<b>Early</b> = cedo."},{"s":"time","t":"dino","q":"The bus left at 8:00, but Tom arrived at 8:30. Tom was ___.","opts":["late","early","fast","high"],"a":"late","tr":"'Late' = atrasado, depois do horario.","tip":"<b>Late</b> = atrasado."},{"s":"cal","t":"dino","q":"There are seven days in one ___.","opts":["week","month","year","century"],"a":"week","tr":"Uma 'week' (semana) tem 7 dias.","tip":"1 <b>week</b> = 7 days."},{"s":"cal","t":"dino","q":"There are one hundred years in one ___.","opts":["century","year","month","week"],"a":"century","tr":"Um 'century' (seculo) tem 100 anos.","tip":"1 <b>century</b> = 100 years."},{"s":"cal","t":"dino","q":"The cold season when it can snow is ___.","opts":["winter","summer","spring","fall"],"a":"winter","tr":"'Winter' = inverno, a estacao fria.","tip":"<b>Winter</b> = inverno."},{"s":"cal","t":"dino","q":"The warm, hot season is ___.","opts":["summer","winter","fall","spring"],"a":"summer","tr":"'Summer' = verao, a estacao quente.","tip":"<b>Summer</b> = verao."},{"s":"cal","t":"dino","q":"The paleontologist visits the dig every day. She goes ___.","opts":["daily","weekly","monthly","yearly"],"a":"daily","tr":"day &rarr; daily (todos os dias).","tip":"day + ly = <b>daily</b>."},{"s":"cal","t":"dino","q":"The museum cleans the fossils once every week. It happens ___.","opts":["weekly","daily","monthly","yearly"],"a":"weekly","tr":"week &rarr; weekly (toda semana).","tip":"week + ly = <b>weekly</b>."},{"s":"cal","t":"dino","q":"The team pays for the dig one time each month, so they pay ___.","opts":["monthly","weekly","daily","yearly"],"a":"monthly","tr":"month &rarr; monthly (todo mes).","tip":"month + ly = <b>monthly</b>."},{"s":"cal","t":"dino","q":"You wash your hands ___ eating, before you touch your food.","opts":["before","during","after","week"],"a":"before","tr":"'Before' = antes (na ordem do tempo).","tip":"<b>Before</b> = antes."},{"s":"cal","t":"dino","q":"The dinosaur slept ___ the whole night. It happened in the middle of the night.","opts":["during","before","after","early"],"a":"during","tr":"'During' = durante (no meio de um periodo).","tip":"<b>During</b> = durante."},{"s":"cal","t":"dino","q":"First we dig, and ___ that, we clean the fossil.","opts":["after","before","during","winter"],"a":"after","tr":"'After' = depois (na ordem do tempo).","tip":"<b>After</b> = depois."},{"s":"inst","t":"games","q":"In the music level of the game, the player hits the ___ with two sticks.<br>(level de música, golpear com baquetas)","opts":["drum","violin","piano","trumpet"],"a":"drum","tr":"O 'drum' (tambor) é tocado batendo com baquetas ou as mãos.","tip":"<b>drum</b> = bater com baquetas/mãos."},{"s":"emo","t":"games","q":"A scary boss scene usually has ___ music.<br>(cena assustadora)","opts":["scary","calm","happy","soft"],"a":"scary","tr":"Uma cena assustadora tem música 'scary' (assustadora).","tip":"cena assustadora → música <b>scary</b>."},{"s":"pastc","t":"games","q":"Yesterday, I ___ playing my favorite game all afternoon.","opts":["was","were","is","are"],"a":"was","tr":"Com 'I' usamos 'was' no past continuous.","tip":"I → <b>was</b> + verbo-ing."},{"s":"sugg","t":"games","q":"Which sentence is a suggestion?","opts":["Let's play the next level!","I played the next level.","He plays the next level.","Did you play the next level?"],"a":"Let's play the next level!","tr":"'Let's + verbo' é uma sugestão (vamos fazer algo).","tip":"<b>Let's</b> + verbo = sugestão."},{"s":"time","t":"games","q":"The daily game event starts at ___, which means 12:00 in the day.","opts":["midday","midnight","hour","minute"],"a":"midday","tr":"'Midday' = meio-dia (12:00).","tip":"<b>midday</b> = meio-dia 12:00."},{"s":"cal","t":"games","q":"There are twelve months in one ___.","opts":["year","week","day","century"],"a":"year","tr":"Um 'year' (ano) tem doze meses.","tip":"1 <b>year</b> = 12 months."},{"s":"inst","t":"games","q":"Which instrument do you blow into and is made of metal?<br>(soprar, de metal)","opts":["trumpet","guitar","drum","violin"],"a":"trumpet","tr":"O 'trumpet' (trompete) é de metal e você sopra para tocar.","tip":"<b>trumpet</b> = soprar, metal."},{"s":"emo","t":"games","q":"A calm and peaceful game scene has ___ music.","opts":["calm","scary","loud","fast"],"a":"calm","tr":"Uma cena calma tem música 'calm' (calma/tranquila).","tip":"cena calma → música <b>calm</b>."},{"s":"pastc","t":"games","q":"We ___ choosing our characters when the game started.","opts":["were","was","is","am"],"a":"were","tr":"Com 'we' usamos 'were' no past continuous.","tip":"we → <b>were</b> + verbo-ing."},{"s":"sugg","t":"games","q":"Complete the suggestion: ___ play online together!","opts":["Let's","We are","He is","Did"],"a":"Let's","tr":"A sugestão começa com 'Let's' + verbo.","tip":"<b>Let's</b> = vamos."},{"s":"time","t":"games","q":"The special boss only appears at ___, which means 12:00 at night.","opts":["midnight","midday","early","late"],"a":"midnight","tr":"'Midnight' = meia-noite (12:00 da noite).","tip":"<b>midnight</b> = meia-noite."},{"s":"cal","t":"games","q":"Choose the -ly adverb: We play this game every day, so we play it ___.","opts":["daily","dayly","everyday","dayily"],"a":"daily","tr":"day → 'daily' (diariamente).","tip":"day → <b>daily</b>."},{"s":"inst","t":"games","q":"The game character plays the ___ with a bow on its strings.<br>(arco nas cordas)","opts":["violin","piano","drum","trumpet"],"a":"violin","tr":"O 'violin' (violino) é tocado com um arco (bow) nas cordas.","tip":"<b>violin</b> = arco + cordas."},{"s":"emo","t":"games","q":"The music in a game is called the ___.","opts":["soundtrack","controller","score number","level"],"a":"soundtrack","tr":"'Soundtrack' = trilha sonora.","tip":"<b>soundtrack</b> = trilha sonora."},{"s":"pastc","t":"games","q":"She ___ collecting power-ups in the last level.","opts":["was","were","are","am"],"a":"was","tr":"Com 'she' usamos 'was' no past continuous.","tip":"she → <b>was</b> + verbo-ing."},{"s":"sugg","t":"games","q":"Complete the suggestion: Why don't we ___ this new game?","opts":["try","tried","tries","trying"],"a":"try","tr":"Após 'Why don't we' usamos o verbo na forma base: try.","tip":"Why don't we + <b>verbo base</b>?"},{"s":"time","t":"games","q":"Make a compound noun: sun + dial = ___.<br>(relógio de sol)","opts":["sundial","sunclock","sunhour","sundialclock"],"a":"sundial","tr":"sun + dial = 'sundial' (relógio de sol).","tip":"sun + dial = <b>sundial</b>."},{"s":"cal","t":"games","q":"Choose the -ly adverb: A new level comes out every week, so it comes out ___.","opts":["weekly","weekily","weeky","everyweek"],"a":"weekly","tr":"week → 'weekly' (semanalmente).","tip":"week → <b>weekly</b>."},{"s":"inst","t":"games","q":"Which instrument has black and white keys?<br>(teclas pretas e brancas)","opts":["piano","guitar","violin","trumpet"],"a":"piano","tr":"O 'piano' tem teclas (keys) pretas e brancas.","tip":"<b>piano</b> = teclas (keys)."},{"s":"emo","t":"games","q":"When the player wins, the music feels ___.<br>(escolha a emoção certa)","opts":["happy","sad","scary","slow"],"a":"happy","tr":"Ao vencer, a música fica 'happy' (feliz).","tip":"vencer → <b>happy</b>."},{"s":"pastc","t":"games","q":"They ___ fighting the boss together online.","opts":["were","was","is","am"],"a":"were","tr":"Com 'they' usamos 'were' no past continuous.","tip":"they → <b>were</b> + verbo-ing."},{"s":"sugg","t":"games","q":"Which is a good way to suggest beating the boss?","opts":["Why don't we beat the boss?","Why we don't beat the boss?","Why don't we beating the boss?","Why don't beat we the boss?"],"a":"Why don't we beat the boss?","tr":"A forma correta é 'Why don't we + verbo base?'.","tip":"<b>Why don't we</b> + verbo base?"},{"s":"time","t":"games","q":"Make a compound noun: hour + glass = ___.<br>(ampulheta)","opts":["hourglass","glasshour","hourclock","glassclock"],"a":"hourglass","tr":"hour + glass = 'hourglass' (ampulheta).","tip":"hour + glass = <b>hourglass</b>."},{"s":"cal","t":"games","q":"Choose the -ly adverb: The game gives a prize every month, so it gives it ___.","opts":["monthly","monthily","everymonth","monthy"],"a":"monthly","tr":"month → 'monthly' (mensalmente).","tip":"month → <b>monthly</b>."},{"s":"inst","t":"games","q":"The boss in this level plays a ___ with six strings.<br>(seis cordas)","opts":["guitar","drum","piano","trumpet"],"a":"guitar","tr":"A 'guitar' (violão/guitarra) tem cordas (strings).","tip":"<b>guitar</b> = cordas (strings)."},{"s":"emo","t":"games","q":"A fast boss fight has ___ and loud music.<br>(emocionante)","opts":["exciting","calm","soft","slow"],"a":"exciting","tr":"'Exciting' = emocionante/empolgante.","tip":"luta rápida → <b>exciting</b>."},{"s":"pastc","t":"games","q":"He wasn't ___ when he lost all his lives.<br>(forma -ing)","opts":["playing","play","plays","played"],"a":"playing","tr":"Após 'was/were' usamos o verbo com -ing: was playing.","tip":"was/were + verbo-<b>ing</b>."},{"s":"sugg","t":"games","q":"Complete: ___ wants to play the next level?<br>(sugestão com 'who')","opts":["Who","What","When","Where"],"a":"Who","tr":"'Who wants to + verbo?' é uma forma de sugerir/convidar.","tip":"<b>Who</b> wants to + verbo?"},{"s":"time","t":"games","q":"Make a compound noun: cell + phone = ___.<br>(celular)","opts":["cellphone","phonecell","cellclock","celltime"],"a":"cellphone","tr":"cell + phone = 'cellphone' (celular).","tip":"cell + phone = <b>cellphone</b>."},{"s":"cal","t":"games","q":"Choose the -ly adverb: A big update happens every year, so it happens ___.","opts":["yearly","yearily","everyyear","yeary"],"a":"yearly","tr":"year → 'yearly' (anualmente).","tip":"year → <b>yearly</b>."},{"s":"inst","t":"games","q":"A group of players who make music together is a ___.","opts":["band","score","level","boss"],"a":"band","tr":"'Band' = banda, um grupo de músicos.","tip":"<b>band</b> = banda."},{"s":"emo","t":"games","q":"The cave level is dark and full of monsters. The music there is very ___.<br>(O oposto de 'calm' para essa cena assustadora?)","opts":["scary","calm","soft","happy"],"a":"scary","tr":"Uma caverna escura com monstros tem musica assustadora (scary), nao calma (calm).","tip":"scary = assustador; calm = calmo; soft = suave; happy = feliz."},{"s":"pastc","t":"games","q":"___ you playing online when the power went off?<br>(pergunta, sujeito 'you')","opts":["Were","Was","Did","Are"],"a":"Were","tr":"Com 'you' a pergunta começa com 'Were'.","tip":"you → <b>Were</b> you + verbo-ing?"},{"s":"sugg","t":"games","q":"Your friend says 'Let's play online!' A good answer is ___.","opts":["Good idea!","I am ten.","It is a console.","The boss is hard."],"a":"Good idea!","tr":"'Good idea!' é uma boa resposta para aceitar uma sugestão.","tip":"aceitar sugestão → <b>Good idea!</b>"},{"s":"time","t":"games","q":"The game clock shows 3:30. We say it is ___.","opts":["half past three","quarter past three","three o'clock","half past four"],"a":"half past three","tr":"3:30 = 'half past three' (três e meia).","tip":"X:30 = <b>half past</b> X."},{"s":"cal","t":"games","q":"First you choose a character, ___ the match you play, and at the end you see the score.<br>(durante)","opts":["during","before","after","ago"],"a":"during","tr":"'During' = durante (algo que acontece ao longo de).","tip":"<b>during</b> = durante."},{"s":"inst","t":"games","q":"The game character will ___ on the stage for the crowd.<br>(tocar/apresentar para a plateia)","opts":["perform","eat","sleep","run"],"a":"perform","tr":"'Perform' = apresentar/tocar para uma plateia.","tip":"<b>perform</b> = apresentar-se para o público."},{"s":"emo","t":"games","q":"Choose the opposite. The victory song is <b>loud</b>, but the menu music is ___.<br>(O antonimo de 'loud'?)","opts":["soft","fast","high","excited"],"a":"soft","tr":"O antonimo de loud (alto/barulhento) e soft (suave/baixo).","tip":"loud x soft; fast x slow; high x low; relaxed x excited."},{"s":"pastc","t":"games","q":"___ he saving his score when the screen froze?<br>(pergunta, sujeito 'he')","opts":["Was","Were","Did","Is"],"a":"Was","tr":"Com 'he' a pergunta começa com 'Was'.","tip":"he → <b>Was</b> he + verbo-ing?"},{"s":"sugg","t":"games","q":"Which sentence is NOT a suggestion?","opts":["The player has three lives.","Let's save the game.","Why don't we try again?","Who wants to play?"],"a":"The player has three lives.","tr":"'The player has three lives' é uma afirmação, não uma sugestão.","tip":"afirmação ≠ sugestão."},{"s":"time","t":"games","q":"The game clock shows 5:00. We say it is ___.","opts":["five o'clock","half past five","quarter past five","five minute"],"a":"five o'clock","tr":"5:00 = 'five o'clock' (cinco horas em ponto).","tip":"X:00 = X <b>o'clock</b>."},{"s":"cal","t":"games","q":"You see the score ___ the match ends, not while playing.<br>(depois)","opts":["after","before","during","early"],"a":"after","tr":"'After' = depois.","tip":"<b>after</b> = depois."},{"s":"inst","t":"games","q":"A 'tune' is a ___.<br>(o que significa 'tune'?)","opts":["melody","controller","console","score number"],"a":"melody","tr":"'Tune' = melodia, uma sequência musical.","tip":"<b>tune</b> = melodia."},{"s":"pastc","t":"games","q":"I was playing ___ my brother was watching the screen.<br>(duas ações ao mesmo tempo)","opts":["while","when","before","after"],"a":"while","tr":"Usamos 'while' para duas ações contínuas ao mesmo tempo.","tip":"duas ações longas juntas → <b>while</b>."},{"s":"sugg","t":"games","q":"Complete: Who wants to ___ a new character?","opts":["choose","chose","chosen","chooses"],"a":"choose","tr":"Após 'Who wants to' usamos o verbo base: choose.","tip":"Who wants to + <b>verbo base</b>."},{"s
