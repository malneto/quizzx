    font-family: 'Orbitron', sans-serif; display:block; width:100%; max-width:360px; margin:10px auto 0; padding: 16px;

  .email-input:focus { border-color: #ffd93d; }

  .question-card {

  .question-text .conta { font-family:'Orbitron',sans-serif; font-size:1.25em; color:#ffd93d; letter-spacing:1px; }

  .options { display: flex; flex-direction: column; gap: 8px; }
  .option-btn {
    font-family: 'Space Mono', monospace; padding: 14px 18px; background: #0d0d3a; border: 2px solid #4a4a8e;

  .final-score { font-family: 'Orbitron', sans-serif; font-size: 3.5em; margin: 20px 0; }

<div class="container">

    <div id="questionArea"></div>
  </div>

  <!-- Final -->
  <div id="finalScreen" class="hidden"></div>
</div>

const SUBJECT_LABELS = {
  soma:'ADIÇÃO', sub:'SUBTRAÇÃO', mult:'MULTIPLICAÇÃO', div:'DIVISÃO',
  mental:'CÁLCULO MENTAL', comb:'COMBINAÇÕES', vp:'VALOR POSICIONAL', prob:'PROBLEMAS'
};

// ======================= MOTOR =======================
let TOTAL_Q = 10, subjectKey = 'tudo', userEmail = '', currentQ = 0, score = 0;
let round = [], selected = null, ready = false;

function shuffle(arr){ const a=[...arr]; for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function fullPool(){ return subjectKey==='tudo' ? QUESTIONS.slice() : QUESTIONS.filter(q=>q.s===subjectKey); }
function updatePoolNote(){ document.getElementById('poolNote').textContent = `${fullPool().length} perguntas disponíveis neste assunto.`; }

function selectSubject(btn,key){
  subjectKey = key;
  document.querySelectorAll('button[onclick^="selectSubject"]').forEach(b=>b.classList.remove('selected'));
  btn.classList.add('selected');
  updatePoolNote();
}
function selectQty(btn,n){
  TOTAL_Q = n;
  document.querySelectorAll('button[onclick^="selectQty"]').forEach(b=>b.classList.remove('selected'));
  btn.classList.add('selected');
}

function start(){
  userEmail = (document.getElementById('emailInput').value || '').trim();
  currentQ = 0; score = 0;
  const pool = fullPool();
  round = shuffle(pool).slice(0, Math.min(TOTAL_Q, pool.length));
  document.getElementById('headerArea').classList.add('hidden');
  document.getElementById('startScreen').classList.add('hidden');
  document.getElementById('finalScreen').classList.add('hidden');
  document.getElementById('quizScreen').classList.remove('hidden');
  showQuestion();
}

function showQuestion(){
  const item = round[currentQ];
  item.__opts = shuffle(item.opts);
  document.getElementById('scoreDisplay').textContent = `Acertos: ${score} / ${currentQ}`;
  document.getElementById('progressFill').style.width = (currentQ / round.length * 100) + '%';
  const html = `
    <div class="question-card">
      <div class="subject-tag">${SUBJECT_LABELS[item.s]}</div>
      <div class="question-number">Pergunta ${currentQ+1} de ${round.length}</div>
      <div class="question-text">${item.q}</div>
      <div class="options">
        ${item.__opts.map(o=>`<button class="option-btn" data-value="${o.replace(/"/g,'&quot;')}" onclick="selectOption(this)">${o}</button>`).join('')}
      </div>
      <button class="submit-btn" id="submitBtn" onclick="checkAnswer()" disabled>RESPONDER</button>
      <div id="feedbackArea"></div>
    </div>`;
  document.getElementById('questionArea').innerHTML = html;
  selected = null; ready = true;
  window.scrollTo(0,0);
}

function selectOption(btn){
  if(!ready) return;
  document.querySelectorAll('.option-btn').forEach(b=>b.classList.remove('selected'));
  btn.classList.add('selected');
  selected = btn.dataset.value;
  document.getElementById('submitBtn').disabled = false;
}

function checkAnswer(){
  if(selected===null) return;
  ready = false;
  const item = round[currentQ];
  const isCorrect = selected === item.a;
  document.querySelectorAll('.option-btn').forEach(btn=>{
    btn.style.pointerEvents='none';
    if(btn.dataset.value===item.a) btn.classList.add('correct');
    else if(btn.dataset.value===selected && !isCorrect) btn.classList.add('wrong');
  });
  if(isCorrect) score++;
  document.getElementById('scoreDisplay').textContent = `Acertos: ${score} / ${currentQ+1}`;
  document.getElementById('submitBtn').classList.add('hidden');
  const last = currentQ >= round.length-1;
  const nextLabel = last ? 'VER RESULTADO &#127942;' : 'PRÓXIMA &#10132;';
  document.getElementById('feedbackArea').innerHTML = `
    <button class="next-btn" onclick="nextQuestion()">${nextLabel}</button>
    <div class="feedback ${isCorrect?'correct':'wrong'}">
      <div class="feedback-icon">${isCorrect?'&#10024; ACERTOU! &#10024;':'&#10060; Quase!'}</div>
      <div class="answer-line">Resposta certa: <strong>${item.a}</strong></div>
      <div class="info-block">
        <span class="blk-label">RESOLUÇÃO</span>
        <span class="info-trans">${item.tr}</span>
        <div class="info-tip"><b>Dica:</b> ${item.tip}</div>
      </div>
    </div>
    <button class="next-btn" onclick="nextQuestion()">${nextLabel}</button>`;
  selected = null;
  window.scrollTo(0,0);
}

function nextQuestion(){
  currentQ++;
  window.scrollTo(0,0);
  if(currentQ < round.length) showQuestion();
  else showFinal();
}

function showFinal(){
  document.getElementById('quizScreen').classList.add('hidden');
  const final = document.getElementById('finalScreen');
  final.classList.remove('hidden');
  const pct = Math.round(score / round.length * 100);
  let cls, emoji, msg;
  if(pct>=80){ cls='great'; emoji='&#127775;'; msg='Excelente! Você é craque em matemática!'; }
  else if(pct>=50){ cls='good'; emoji='&#128170;'; msg='Muito bom! Continue treinando!'; }
  else { cls='try-again'; emoji='&#129504;'; msg='Continue praticando — você consegue!'; }
  const subjName = subjectKey==='tudo' ? 'Tudo' : SUBJECT_LABELS[subjectKey];
  final.innerHTML = `
    <div class="final-screen">
      <h1>RESULTADO</h1>
      <div style="font-size:3em">${emoji}</div>
      <div class="final-score ${cls}">${score}/${round.length}</div>
      <div class="final-msg">${msg}</div>
      <div style="color:#8888cc;margin-bottom:20px">Assunto: ${subjName} | Acerto: ${pct}%</div>
      ${userEmail?`<div id="emailStatus" style="color:#6bff6b;margin-bottom:15px;font-size:0.85em">Preparando e-mail para ${userEmail}...</div>`:''}
      <button class="restart-btn" onclick="start()">JOGAR DE NOVO</button>
      <button class="restart-btn" onclick="backToStart()">TROCAR ASSUNTO</button>
    </div>`;
  if(userEmail) sendResult(pct, subjName);
}

function sendResult(pct, subjName){
  const subject = encodeURIComponent(`QuizX - Matemática: ${score}/${round.length} (${pct}%)`);
  const lines = [`QuizX - Matemática 4º ano`, ``, `Assunto: ${subjName}`, `Resultado: ${score}/${round.length} (${pct}%)`, ``, `Perguntas da rodada:`];
  round.forEach((it,i)=>lines.push(`${i+1}. ${it.q.replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim()}  ->  ${it.a}`));
  lines.push(``, `---`, `Enviado por QuizX`);
  const body = encodeURIComponent(lines.join('\n'));
  window.open(`mailto:${userEmail}?subject=${subject}&body=${body}`, '_blank');
  const st = document.getElementById('emailStatus');
  if(st) st.textContent = `E-mail preparado para ${userEmail}!`;
}

function backToStart(){
  document.getElementById('headerArea').classList.remove('hidden');
  document.getElementById('finalScreen').classList.add('hidden');
  document.getElementById('quizScreen').classList.add('hidden');
  document.getElementById('startScreen').classList.remove('hidden');
}

updatePoolNote();
if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('../sw.js').catch(function(){});});}
</script>
